h1,h2,h3,h4{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.mono{font-family:var(--fm);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.eyebrow{font-size:11px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-ink)}

/* Masthead */
.top{background:#fff;color:var(--navy);position:sticky;top:env(safe-area-inset-top,0px);z-index:20;border-bottom:3px solid var(--teal);box-shadow:0 2px 12px rgba(11,45,74,.06)}
.top-in{max-width:1240px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;color:var(--navy)}
.brand .bm{height:38px;width:auto;flex:none}
.brand .bw{height:17px;width:auto;display:block}
.brand small{display:block;font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
.portals{display:flex;gap:4px;margin-left:auto;overflow-x:auto;max-width:100%;scrollbar-width:none}
.portals::-webkit-scrollbar{display:none}
.portals button{background:transparent;border:1px solid transparent;color:var(--muted);padding:7px 12px;border-radius:7px;font-size:13px;font-weight:600;white-space:nowrap}
.portals button:hover{background:var(--line-2);color:var(--navy)}
.portals button.on{background:var(--navy);color:#fff}
.demo-tag{font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--navy);background:var(--silver-2);padding:3px 8px;border-radius:999px;font-weight:700;white-space:nowrap}
@media (max-width:760px){.portals{margin-left:0;order:3;width:100%}.demo-tag{margin-left:auto}}

.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 48px}

/* Generic */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:0 1px 2px rgba(11,45,74,.04),0 4px 14px rgba(11,45,74,.04)}
button.card,.portal-card,.track-card{transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease}
button.card:hover,.portal-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,45,74,.10)}
.eyebrow{display:inline-flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:18px;height:2px;background:var(--teal);display:inline-block}
.btn{box-shadow:0 1px 2px rgba(11,45,74,.12)}
.btn.teal:not(.ghost){box-shadow:0 4px 12px rgba(0,120,122,.22)}
.pad{padding:18px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.sec-h h2{font-size:18px;font-weight:700;color:var(--navy)}
.sec-h h3{font-size:15px;font-weight:700;color:var(--navy)}
.btn{display:inline-flex;align-items:center;gap:8px;border-radius:8px;padding:9px 16px;font-weight:600;font-size:13.5px;border:1px solid var(--navy);background:var(--navy);color:#fff}
.btn:hover{background:var(--navy-2)}
.btn.teal{background:var(--teal-ink);border-color:var(--teal-ink)}
.btn.teal:hover{background:#006566}
.btn.ghost{background:#fff;color:var(--navy);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--navy)}
.btn.sm{padding:6px 11px;font-size:12.5px}
.btn.danger{background:#fff;color:var(--bad);border-color:#E9C3C0}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:999px;white-space:nowrap;line-height:1.6}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-teal{background:var(--teal-soft);color:var(--teal-ink)}
.p-navy{background:var(--navy);color:#fff}
.p-neu{background:var(--line-2);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;display:inline-block}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(280px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spacer{flex:1}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{border-collapse:collapse;width:100%;font-size:13px}
th{text-align:left;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700;padding:10px 12px;background:#F8FAFB;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:#F7FAFC}
.who b{display:block;font-weight:600}
.who span{font-size:12px;color:var(--muted)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.avatar.lg{width:56px;height:56px;font-size:19px;background:var(--navy);color:#fff}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--navy)}
.field .hint{font-size:11.5px;color:var(--muted)}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=time],select,textarea{font:inherit;font-size:13.5px;border:1px solid var(--line);border-radius:8px;padding:9px 11px;background:#fff;color:var(--ink);width:100%}
select{padding-right:28px}
textarea{min-height:76px;resize:vertical}
input:focus,select:focus,textarea:focus{border-color:var(--teal)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:#fff}
.seg button{border:0;background:#fff;padding:8px 14px;font-size:13px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--navy);color:#fff}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.note{font-size:12.5px;color:var(--muted);background:var(--line-2);border-radius:8px;padding:10px 12px}

/* Home */
.hero{display:grid;grid-template-columns:1.15fr .85fr;gap:28px;align-items:stretch;margin-bottom:28px}
@media (max-width:900px){.hero{grid-template-columns:1fr}}
.hero-l{background:radial-gradient(120% 90% at 100% 100%,rgba(0,168,168,.28) 0%,rgba(0,168,168,0) 55%),linear-gradient(140deg,#0B2D4A 0%,#0E3858 60%,#0B3E52 100%);color:#fff;border-radius:16px;padding:38px 32px;position:relative;overflow:hidden;box-shadow:0 14px 34px rgba(11,45,74,.22)}
.hero-l::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 56px),repeating-linear-gradient(0deg,rgba(255,255,255,.035) 0 1px,transparent 1px 56px);-webkit-mask-image:linear-gradient(120deg,#000 10%,transparent 75%);mask-image:linear-gradient(120deg,#000 10%,transparent 75%);pointer-events:none}
.hero-l>*{position:relative}
.hero-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:28px;padding-top:18px;border-top:1px solid rgba(255,255,255,.14)}
.hero-stats b{display:block;font-size:24px;font-weight:800;font-variant-numeric:tabular-nums}
.hero-stats span{font-size:12px;color:#9FB3C6}
.hero-l .eyebrow{color:#7FD6D6}
.hero-l h1{font-size:clamp(34px,6vw,54px);font-weight:800;letter-spacing:.12em;margin:10px 0 6px}
.hero-l .tag{font-size:clamp(17px,2.4vw,22px);font-weight:500;color:#DCE6EF}
.hero-l p.lead{color:#B9C7D5;max-width:52ch;margin:16px 0 24px}
.hero-l .btn.ghost{background:transparent;color:#fff;border-color:#4A6A88}
.hero-l .btn.ghost:hover{border-color:#fff}
.hero-l .btn.teal{background:var(--teal);border-color:var(--teal);color:var(--navy)}
.hero-l .btn.teal:hover{background:#13BDBD}
.hero-art{position:absolute;right:-30px;bottom:-24px;width:300px;opacity:.16;pointer-events:none}
.glance{padding:20px}
.glance h3{font-size:14px;color:var(--navy);margin-bottom:12px}
.kpi-mini{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi-mini div{border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi-mini b{font-size:24px;font-weight:800;color:var(--navy);display:block;font-variant-numeric:tabular-nums}
.kpi-mini span{font-size:12px;color:var(--muted)}
.stagebar{display:flex;height:10px;border-radius:5px;overflow:hidden;margin:16px 0 8px;background:var(--line-2)}
.stagebar i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:11.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:5px}
.legend i{width:9px;height:9px;border-radius:2px;display:inline-block}
.chal{display:grid;grid-template-columns:1fr 26px 1fr;gap:10px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line-2)}
.chal:last-child{border-bottom:0}
.chal .c1{font-weight:600;color:var(--bad)}
.chal .c2{font-weight:600;color:var(--ok)}
.chal svg{width:20px;color:var(--silver)}
@media (max-width:600px){.chal{grid-template-columns:1fr}.chal svg{transform:rotate(90deg)}}
.track-card{padding:18px;display:flex;flex-direction:column;gap:10px;border-top-width:4px}
.track-card .tic{width:38px;height:38px;border-radius:10px;display:grid;place-items:center}
.kpi{transition:transform .18s ease,box-shadow .18s ease}
.kpi .ic{width:46px;height:46px;border-radius:12px}
.track-card .code{font-family:var(--fm);font-size:11px;color:var(--teal-ink);font-weight:600}
.track-card h3{font-size:16px;color:var(--navy)}
.track-card ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;display:flex;flex-direction:column;gap:3px}
.journey{display:grid;grid-template-columns:repeat(7,1fr);gap:0;counter-reset:j}
.journey div{position:relative;padding:14px 10px 0 0}
.journey div::before{content:"";position:absolute;top:22px;left:18px;right:0;height:2px;background:var(--silver)}
.journey div:last-child::before{display:none}
.journey .n{position:relative;z-index:1;width:18px;height:18px;border-radius:50%;background:var(--teal);color:var(--navy);font-size:10px;font-weight:800;display:grid;place-items:center;border:3px solid var(--bg);box-sizing:content-box}
.journey b{display:block;margin-top:10px;font-size:13px;color:var(--navy)}
.journey span{font-size:12px;color:var(--muted)}
@media (max-width:820px){.journey{grid-template-columns:1fr}.journey div{padding:8px 0 8px 34px}.journey div::before{top:30px;left:10px;bottom:-14px;right:auto;width:2px;height:auto}.journey .n{position:absolute;left:0;top:10px}.journey b{margin-top:0}}
.portal-card{padding:18px;display:flex;flex-direction:column;gap:8px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:var(--r)}
.portal-card:hover{border-color:var(--navy)}
.portal-card .ic{width:40px;height:40px;border-radius:9px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center}
.portal-card h3{font-size:15px;color:var(--navy)}
.portal-card p{font-size:12.5px;color:var(--muted)}
.portal-card .tg{font-size:11.5px;font-weight:600;color:var(--teal-ink)}
.foot{margin-top:36px;font-size:12px;color:var(--muted);border-top:1px solid var(--line);padding-top:14px;display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}

.welcome{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:28px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:16px;padding:34px 36px;position:relative;overflow:hidden;box-shadow:0 10px 30px rgba(11,45,74,.08)}
.welcome::after{content:"";position:absolute;left:0;right:0;bottom:0;height:5px;background:linear-gradient(90deg,var(--navy),var(--teal),var(--silver))}
.wl-logo{display:grid;place-items:center}
.wl-logo img{width:min(400px,100%);height:auto}
.wl-tx h1{font-size:clamp(26px,3.6vw,38px);color:var(--navy);font-weight:800;margin:10px 0 10px;letter-spacing:-.015em}
.wl-tx .lead{color:var(--muted);font-size:15px;max-width:48ch}
@media (max-width:820px){.welcome{grid-template-columns:1fr;text-align:center;padding:28px 20px}.wl-tx .lead{margin:0 auto}.wl-tx .row{justify-content:center}.wl-tx .eyebrow{justify-content:center}}
.roles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1040px){.roles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.roles{grid-template-columns:1fr}}
.role-card{display:flex;flex-direction:column;gap:8px;padding:22px;background:#fff;border:1px solid var(--line);border-top:4px solid var(--navy);border-radius:12px;box-shadow:0 1px 2px rgba(11,45,74,.04),0 4px 14px rgba(11,45,74,.04);transition:transform .18s ease,box-shadow .18s ease}
.role-card:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(11,45,74,.10)}
.role-card:first-child{border-top-color:var(--teal)}
.role-card .ic{width:48px;height:48px;border-radius:12px;background:var(--navy);color:#fff;display:grid;place-items:center}
.role-card .who-l{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--teal-ink);margin-top:8px}
.role-card h3{font-size:17px;color:var(--navy)}
.role-card p{font-size:13px;color:var(--muted);min-height:3.2em}
.role-card .how{display:flex;gap:8px;align-items:center;font-size:12px;color:var(--muted);border-top:1px solid var(--line-2);padding-top:12px;margin-top:auto}
.role-card .how svg{color:var(--navy)}
.role-card .btn{width:100%;justify-content:center;margin-top:6px}
/* Portal header */
.phead{display:flex;align-items:center;gap:16px;margin-bottom:22px;flex-wrap:wrap;position:relative;overflow:hidden;color:#fff;border-radius:16px;padding:22px 24px;background:radial-gradient(90% 140% at 100% 0%,rgba(0,168,168,.30) 0%,rgba(0,168,168,0) 60%),linear-gradient(135deg,#0B2D4A 0%,#11406A 100%);box-shadow:0 10px 26px rgba(11,45,74,.18)}
.phead::before{content:"";position:absolute;inset:0;background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 48px);-webkit-mask-image:linear-gradient(90deg,transparent 30%,#000 100%);mask-image:linear-gradient(90deg,transparent 30%,#000 100%);pointer-events:none}
.phead>*{position:relative}
.phead .ic{width:48px;height:48px;border-radius:12px;background:var(--teal);color:var(--navy);display:grid;place-items:center;flex:none}
.phead h1{font-size:23px;color:#fff;font-weight:800}
.phead p{color:#A9BED1;font-size:13px}
.phead .field label{color:#C9D6E2}
.phead .muted,.phead b{color:#DCE6EF!important}
.phead select{border-color:transparent}
.phead .spacer{min-width:10px}

/* Apply */
.steps{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}
.steps span{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:600;color:var(--muted);padding:6px 12px 6px 6px;border-radius:999px;background:#fff;border:1px solid var(--line)}
.steps span i{width:20px;height:20px;border-radius:50%;background:var(--line-2);display:grid;place-items:center;font-style:normal;font-size:11px}
.steps span.on{color:var(--navy);border-color:var(--navy)}
.steps span.on i{background:var(--navy);color:#fff}
.steps span.done i{background:var(--teal);color:var(--navy)}
.tsel{text-align:left;padding:16px;border:1.5px solid var(--line);border-radius:var(--r);background:#fff;display:flex;flex-direction:column;gap:6px}
.tsel:hover{border-color:var(--navy)}
.tsel.on{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-soft)}
.tsel b{color:var(--navy);font-size:15px}
.tsel span{font-size:12.5px;color:var(--muted)}
.tsel em{font-style:normal;font-size:11.5px;font-weight:600;color:var(--teal-ink)}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
.apply-layout{display:grid;grid-template-columns:1fr 300px;gap:18px;align-items:start}
@media (max-width:900px){.apply-layout{grid-template-columns:1fr}}
.pri-box{padding:16px}
.pri-box .big{font-size:20px;font-weight:800;margin:6px 0}
.check-line{display:flex;gap:8px;font-size:12.5px;align-items:flex-start;margin-top:6px}
.check-line svg{flex:none;width:16px;margin-top:2px}
.file-in{border:1.5px dashed var(--silver);border-radius:8px;padding:12px;display:flex;align-items:center;gap:10px;background:#FAFBFC;font-size:13px}
.file-in input{font-size:12px;max-width:100%}
.done-box{text-align:center;padding:36px 20px}
.done-box .ref{font-family:var(--fm);font-size:22px;color:var(--navy);font-weight:600;margin:8px 0}

/* Trainee */
.t-hero{padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center}
@media (max-width:760px){.t-hero{grid-template-columns:auto 1fr}.t-hero .ingot-box{grid-column:1/-1}}
.t-hero h2{font-size:20px;color:var(--navy)}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted);margin-top:6px}
.meta b{color:var(--ink);font-weight:600}
.ingot-box{width:300px;max-width:100%}
.ingot-box svg{width:100%;height:auto;display:block}
.ingot-box p{font-size:12px;color:var(--muted);text-align:center;margin-top:4px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2.5px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:13.5px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--teal)}
.tabs button .pill{margin-left:6px}
.chk{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line-2)}
.chk:last-child{border-bottom:0}
.chk .ico{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;flex:none}
.chk .ico.ok{background:var(--ok-soft);color:var(--ok)}
.chk .ico.pend{background:var(--warn-soft);color:var(--warn)}
.chk .ico.na{background:var(--line-2);color:var(--muted)}
.chk .ico svg{width:14px}
.chk .tx{flex:1;min-width:0}
.chk .tx b{display:block;font-size:13.5px;font-weight:600}
.chk .tx span{font-size:12px;color:var(--muted)}
.sms{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:#FAFBFC}
.sms .h{display:flex;justify-content:space-between;font-size:11.5px;color:var(--muted);margin-bottom:4px;gap:8px}
.sms p{font-size:13px}
.cert{border:2px solid var(--navy);border-radius:6px;padding:26px 22px;text-align:center;background:#fff;position:relative;outline:1px solid var(--silver);outline-offset:-8px}
.cert .eyebrow{color:var(--muted)}
.cert h3{font-size:22px;color:var(--navy);margin:10px 0 4px}
.cert .nm{font-size:20px;font-weight:700;color:var(--teal-ink);margin:10px 0}
.cert .sig{display:flex;justify-content:space-around;margin-top:22px;font-size:11.5px;color:var(--muted);gap:10px}
.cert .sig div{border-top:1px solid var(--silver);padding-top:5px;min-width:110px}
.locked{display:flex;gap:12px;align-items:flex-start;padding:16px;border:1px dashed var(--silver);border-radius:10px;background:#FAFBFC}
.stars{display:flex;gap:4px}
.stars button{background:none;border:0;padding:2px;color:var(--silver)}
.stars button.on{color:#D9A21B}
.stars svg{width:24px}
.sess{display:flex;flex-wrap:wrap;gap:8px}
.sess span{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;font-weight:600;background:#fff}
.sess span small{font-weight:500;color:var(--muted);font-size:11.5px}
.sess span.miss{color:var(--muted);background:var(--line-2);border-style:dashed}

/* Charts */
.hb{display:grid;grid-template-columns:minmax(90px,170px) 1fr 34px;gap:10px;align-items:center;font-size:12.5px;padding:4px 0}
.hb .l{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--ink)}
.hb .t{height:10px;background:var(--line-2);border-radius:5px;overflow:hidden}
.hb .t i{display:block;height:100%;background:var(--navy);border-radius:5px}
.hb.teal .t i{background:var(--teal)}
.hb b{text-align:right;font-variant-numeric:tabular-nums}
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:18px;border-bottom:1px solid var(--line)}
.cols div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px;min-width:0}
.cols div i{display:block;width:100%;max-width:34px;background:var(--teal);border-radius:4px 4px 0 0}
.cols div b{font-size:11.5px;font-variant-numeric:tabular-nums;color:var(--navy)}
.cols-l{display:flex;gap:8px;margin-top:6px}
.cols-l span{flex:1;text-align:center;font-size:11px;color:var(--muted)}
.lc svg{width:100%;height:auto;display:block}

/* HR */
.hr{display:grid;grid-template-columns:210px 1fr;gap:20px;align-items:start}
.rail{position:sticky;top:90px;display:flex;flex-direction:column;gap:2px;padding:8px}
.rail button{display:flex;align-items:center;gap:10px;background:none;border:0;text-align:left;padding:9px 12px;border-radius:8px;font-weight:600;color:var(--muted);font-size:13.5px}
.rail button svg{width:17px;flex:none}
.rail button:hover{background:var(--line-2);color:var(--navy)}
.rail button.on{background:var(--navy);color:#fff}
.rail button .pill{margin-left:auto}
@media (max-width:900px){.hr{grid-template-columns:1fr}.rail{position:static;flex-direction:row;overflow-x:auto;padding:6px}.rail button{white-space:nowrap}}
.kpi{padding:16px 18px;display:flex;gap:14px;align-items:center}
.kpi .ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi .ic svg{width:21px}
.kpi b{font-size:28px;font-weight:800;line-height:1.1;color:var(--navy);font-variant-numeric:tabular-nums;display:block}
.kpi span{font-size:12.5px;color:var(--muted)}
.alert{display:flex;gap:12px;align-items:center;padding:11px 14px;border-bottom:1px solid var(--line-2);font-size:13px}
.alert:last-child{border-bottom:0}
.alert .sev{width:4px;align-self:stretch;border-radius:2px;flex:none}
.alert .tx{flex:1;min-width:0}
.alert .tx b{font-weight:600}
.alert .tx span{display:block;font-size:12px;color:var(--muted)}
.filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;align-items:center}
.filters select,.filters input{width:auto;min-width:140px;padding:7px 10px;font-size:13px}
.filters input{min-width:200px;flex:1}
.cap-card{padding:16px;display:flex;flex-direction:column;gap:10px}
.cap-card h4{font-size:14px;color:var(--navy)}
.cap-nums{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.cap-nums b{display:block;font-size:20px;font-weight:800;color:var(--navy);font-variant-numeric:tabular-nums}
.cap-nums span{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.seats{display:flex;gap:3px;flex-wrap:wrap}
.seats i{width:14px;height:14px;border-radius:3px;background:var(--navy)}
.seats i.free{background:#fff;border:1.5px solid var(--teal)}
.cap-card.full{border-color:#E9C3C0}
.mx td.c{text-align:center}
.mx .st{width:24px;height:24px;border-radius:6px;display:inline-grid;place-items:center;border:0}
.mx .st svg{width:13px}
.mx .st.ok{background:var(--ok-soft);color:var(--ok)}
.mx .st.pend{background:var(--warn-soft);color:var(--warn)}
.mx .st.na{background:transparent;color:var(--silver)}
.mx button.st:hover{outline:1.5px solid var(--navy)}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(11,45,74,.42);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(560px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:-10px 0 30px rgba(11,45,74,.18);padding-bottom:env(safe-area-inset-bottom,0px)}
.drawer-h{background:var(--navy);color:#fff;padding:18px 20px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;gap:14px;align-items:center;position:sticky;top:0;z-index:2}
.drawer-h h3{font-size:17px}
.drawer-h p{font-size:12px;color:var(--silver)}
.drawer-h .x{margin-left:auto;background:var(--navy-2);border:0;color:#fff;width:34px;height:34px;border-radius:8px;display:grid;place-items:center;flex:none}
.drawer-b{padding:18px 20px;display:flex;flex-direction:column;gap:16px}
.kv{width:100%;font-size:13px}
.kv th{width:42%;text-transform:none;letter-spacing:0;font-size:12.5px;color:#fff;background:var(--navy-3);font-weight:600;border-bottom:1px solid var(--navy-2);white-space:normal}
.kv td{background:#fff}
.log{display:flex;flex-direction:column;gap:0}
.log div{display:grid;grid-template-columns:96px 1fr;gap:10px;font-size:12.5px;padding:7px 0;border-bottom:1px dashed var(--line)}
.log div:last-child{border-bottom:0}
.log span{color:var(--muted)}
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.modal-b{background:#fff;border-radius:12px;max-width:520px;width:100%;max-height:90vh;overflow:auto;box-shadow:0 20px 50px rgba(11,45,74,.3)}
.modal-h{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.modal-h h3{font-size:16px;color:var(--navy)}
.modal-c{padding:18px;display:flex;flex-direction:column;gap:12px}
.modal-f{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.phone{background:var(--line-2);border-radius:14px;padding:14px}
.bubble{background:#fff;border-radius:14px 14px 14px 4px;padding:11px 13px;font-size:13px;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.bubble+.bubble{margin-top:8px}
.bubble[dir=rtl]{border-radius:14px 14px 4px 14px;font-family:'IBM Plex Sans Arabic',var(--f)}
.email-pv{border:1px solid var(--line);border-radius:8px;font-size:13px}
.email-pv .eh{padding:10px 12px;border-bottom:1px solid var(--line);background:#F8FAFB;font-size:12px;color:var(--muted)}
.email-pv .eh b{color:var(--ink)}
.email-pv .eb{padding:12px}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:11px 18px;border-radius:9px;font-weight:600;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(11,45,74,.3);display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px)}
.toast svg{width:16px;color:var(--teal)}

/* Supervisor */
.sup{display:grid;grid-template-columns:300px 1fr;gap:18px;align-items:start}
@media (max-width:900px){.sup{grid-template-columns:1fr}}
.tlist{display:flex;flex-direction:column}
.tlist button{display:flex;gap:11px;align-items:center;background:#fff;border:0;border-bottom:1px solid var(--line-2);padding:12px 14px;text-align:left}
.tlist button:last-child{border-bottom:0}
.tlist button:hover{background:#F7FAFC}
.tlist button.on{background:var(--teal-soft);box-shadow:inset 3px 0 0 var(--teal)}
.tlist .who{flex:1;min-width:0}
.ev-form{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.ev-top{background:var(--navy);color:#fff;padding:14px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.ev-top h3{font-size:15px}
.ev-top span{font-size:12px;color:var(--silver)}
.ev-sec{padding:14px 16px;border-bottom:1px solid var(--line)}
.ev-sec h4{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--navy);margin-bottom:10px}
.ev-det{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px 16px;font-size:13px}
.ev-det span{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.att{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.att button{border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:10px;text-align:left;display:flex;flex-direction:column;gap:2px}
.att button b{font-size:13px}
.att button span{font-size:12px;color:var(--muted)}
.att button.on{border-color:var(--navy);background:var(--navy-soft)}
.comp{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.comp:last-of-type{border-bottom:0}
.comp .i{font-family:var(--fm);font-size:12px;color:var(--muted)}
.sc{display:flex;gap:3px}
.sc button{width:34px;height:30px;border:1px solid var(--line);background:#fff;border-radius:6px;font-weight:700;font-size:12.5px;color:var(--muted)}
.sc button.on{background:var(--teal);border-color:var(--teal);color:var(--navy)}
@media (max-width:560px){.comp{grid-template-columns:22px 1fr}.sc{grid-column:2}}
.sc-key{display:flex;gap:10px;flex-wrap:wrap;font-size:11.5px;color:var(--muted);margin-bottom:6px}
.ev-res{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;padding:14px 16px;background:#F8FAFB}
.ev-res div{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.ev-res b{font-size:22px;font-weight:800;color:var(--navy);display:block;font-variant-numeric:tabular-nums}
.ev-res span{font-size:12px;color:var(--muted)}
.plan{display:flex;flex-direction:column}
.plan label{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line-2);font-size:13px}
.plan label:last-child{border-bottom:0}
.plan input{width:16px;height:16px;accent-color:var(--teal-ink)}
.plan .dn{text-decoration:line-through;color:var(--muted)}
.empty{padding:30px;text-align:center;color:var(--muted)}
/* Sign-in */
.login{display:grid;grid-template-columns:minmax(0,440px) minmax(0,1fr);gap:20px;align-items:start;max-width:940px;margin:0 auto}
@media (max-width:760px){.login{grid-template-columns:1fr}}
.login-c{padding:26px}
.login-c .lk{width:44px;height:44px;border-radius:12px;background:var(--navy-soft);color:var(--navy);display:grid;place-items:center;margin-bottom:12px}
.login-c h2{font-size:19px;color:var(--navy)}
.login-c form{display:flex;flex-direction:column;gap:14px;margin-top:18px}
.login-c .btn{justify-content:center}
.otp{font-family:var(--fm);font-size:22px;letter-spacing:.5em;text-align:center}
.demo-acc{margin-top:20px;padding-top:16px;border-top:1px dashed var(--line);display:flex;flex-direction:column;gap:6px}
.demo-acc p{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.demo-acc button{display:flex;justify-content:space-between;gap:10px;align-items:center;background:#F8FAFB;border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12.5px;text-align:left}
.demo-acc button:hover{border-color:var(--navy)}
.demo-acc button span{color:var(--muted);font-family:var(--fm);font-size:11.5px}
.sec-list{display:flex;flex-direction:column;gap:12px;margin-top:12px}
.sec-list div{display:flex;gap:12px;align-items:flex-start;font-size:13px}
.sec-list svg{width:18px;flex:none;color:var(--teal-ink);margin-top:1px}
.sec-list b{display:block;color:var(--navy)}
.sec-list span{color:var(--muted);font-size:12.5px}
.role-tbl td,.role-tbl th{font-size:12px;padding:8px 10px}
.who-chip{display:flex;gap:10px;align-items:center;background:rgba(255,255,255,.09);border:1px solid rgba(255,255,255,.14);padding:8px 10px;border-radius:12px}
.who-chip .who b{color:#fff!important;font-size:13px}
.who-chip .who span{color:#A9BED1;font-size:11.5px}
.who-chip .btn{background:#fff;color:var(--navy);border-color:#fff}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slin .22s ease-out}.modal-b{animation:pop .18s ease-out}@keyframes slin{from{transform:translateX(30px);opacity:.6}}@keyframes pop{from{transform:scale(.97);opacity:.6}}}
</style>

function lineChart(evals){

  const grid=[0,25,50,75,100].map(v=>`<line x1="${L}" x2="${W-Rt}" y1="${y(v)}" y2="${y(v)}" stroke="#E7EBEF"/><text x="${L-6}" y="${y(v)+3.5}" text-anchor="end" font-size="9.5" fill="#5A6978">${v}</text>`).join('');
  const pts=evals.map((e,i)=>[x(i),y(e.final)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=n>1?`<path d="${path} L${pts[n-1][0]} ${y(0)} L${pts[0][0]} ${y(0)} Z" fill="#00A8A8" fill-opacity=".12"/>`:'';
  return `<div class="lc"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Monthly evaluation scores">${grid}${area}<path d="${path}" fill="none" stroke="#00787A" stroke-width="2.2"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?4.5:3.2}" fill="${i===n-1?'#0B2D4A':'#fff'}" stroke="#0B2D4A" stroke-width="1.6"/><text x="${p[0]}" y="${p[1]-9}" text-anchor="middle" font-size="10" font-weight="700" fill="#0B2D4A">${evals[i].final}%</text><text x="${p[0]}" y="${H-8}" text-anchor="middle" font-size="9.5" fill="#5A6978">${evals[i].month.slice(0,3)}</text>`).join('')}</svg></div>`;
}

}
function journeyPct(r){
  if(r.stage==='Completed'){const p=POST.filter(([k])=>r.post[k]&&r.post[k]!=='na');return Math.round(80+20*p.filter(([k])=>r.post[k]==='done').length/p.length)}

function msgs(r){

    case 'ev-sc':S.ev.scores[Number(t.dataset.i)]=Number(v);render(true);break;

    case 'ev-submit':{const r=byId(S.ev.id),E=S.ev;const fin=Math.round(E.scores.reduce((x,y)=>x+y,0)/32*100);

    case 'adv':{const r=byId(id);const ns=nextStage(r);if(!ns)break;
      if(ns==='Assessment'&&r.iq==null){r.iq=ri(55,96);r.pers=ri(52,94)}
      if(ns==='Selected'){if(!r.dept)assign(r,true);r.accepted=TODAY}
      r.stage=ns;lg(r,TODAY,HRS[0],'Moved to '+ns+(ns==='Selected'?' · nominated to '+r.dept:''));toast(r.name.split(' ')[0]+' moved to '+ns);render(true);break}
    case 'rej':{const r=byId(id);r.stage='Not Selected';r.reason='Not selected by HR';lg(r,TODAY,HRS[0],'Marked not selected');toast(r.name.split(' ')[0]+' marked not selected');render(true);break}
    case 'med-sms':S.modal={type:'sms',id};render(true);break;
    case 'med-send':{const r=byId(id);r.medSms=true;lg(r,TODAY,HRS[0],`Medical SMS sent · ${fmt(r.medDate)} ${r.medTime}`);S.modal=null;toast('SMS sent to +968 '+r.phone);render(true);break}
    case 'med-res':{const r=byId(id);if(v==='Fit'){r.stage='Pre-Training';r.start=D(2026,11,1);r.end=D(2026,12,31);setSup(r);setPre(r,0);LOAD[r.dept]++;lg(r,TODAY,'Medical Centre','Medical check-up · Fit · moved to Pre-Training');toast(r.name.split(' ')[0]+' is fit · moved to Pre-Training')}
      else{r.stage='Not Selected';r.reason='Medical';lg(r,TODAY,'Medical Centre','Medical check-up · Unfit');toast(r.name.split(' ')[0]+' recorded as unfit')}render(true);break}
    case 'email-short':S.modal={type:'email',dept:v};render(true);break;
    case 'email-send':S.modal=null;toast('Shortlist emailed to the department');render(true);break;
    case 'tmode':S.tf.mode=v;render(true);break;
    case 'tog':{const r=byId(id);const obj=t.dataset.sec==='post'?r.post:r.pre;const k=t.dataset.k;obj[k]=obj[k]==='done'?'pending':'done';
      if(t.dataset.sec==='post'&&['ppe','card','laptop'].every(x=>r.post[x]!=='pending'))r.post.cert='done';
      lg(r,TODAY,HRS[0],(PRE.concat(POST).find(p=>p[0]===k)||[k,k])[1]+' · '+obj[k]);render(true);break}
    case 'hyear':S.hf.year=S.hf.year==v?'all':v;render(true);break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.dataset.ap){S.apply.f[t.dataset.ap]=t.value;return}
  if(t.id==='ev-c'&&S.ev){S.ev.comment=t.value;return}
  if(t.id==='fb-text'){S.fb.text=t.value;return}
  if(t.id==='f-q'||t.id==='h-q'){const pos=t.selectionStart;if(t.id==='f-q')S.f.q=t.value;else S.hf.q=t.value;render(true);const n=document.getElementById(t.id);if(n){n.focus();n.setSelectionRange(pos,pos)}}
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.ap){S.apply.f[t.dataset.ap]=t.value;return}
  if(t.dataset.file){S.apply.f['file_'+t.dataset.file]=t.files[0]?t.files[0].name:'';render(true);return}
  if(t.id==='tsel'){S.tId=t.value;S.tTab=null;S.fb={rating:0,text:''};render(true);return}
  if(t.id==='supsel'){S.supId=t.value;S.supSel=null;S.ev=null;render(true);return}
  if(t.id==='f-track'){S.f.track=t.value;render(true)}
  if(t.id==='f-pri'){S.f.pri=t.value;render(true)}
  if(t.id==='f-stage'){S.f.stage=t.value;render(true)}
  if(t.id==='h-year'){S.hf.year=t.value;render(true)}
  if(t.id==='h-dept'){S.hf.dept=t.value;render(true)}
  if(t.id==='t-inc'){S.tf.inc=t.checked;render(true)}
  if(t.dataset.plan!=null){const r=byId(S.supSel);r.plan[Number(t.dataset.plan)].done=t.checked;render(true)}
  if(t.dataset.med){const r=byId(t.dataset.id);if(t.dataset.med==='date')r.medDate=t.value?new Date(t.value+'T00:00'):null;else r.medTime=t.value;render(true)}
});
document.addEventListener('submit',e=>{e.preventDefault();const f={'lf-t1':lgTSend,'lf-t2':lgTVerify,'lf-s':lgS,'lf-h1':lgH1,'lf-h2':lgH2}[e.target.id];if(f){f();render(true);const n=document.querySelector('#lg-code,#lg-hcode');if(n)n.focus()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&(S.drawer||S.modal)){S.modal?S.modal=null:S.drawer=null;render(true)}
  if(e.key==='Enter'&&e.target.id==='plan-new'){e.preventDefault();document.querySelector('[data-act="plan-add"]').click()}});
render();
</script>

</body>
</html>
