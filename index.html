html,body{margin:0}img{max-width:100%}[hidden]{display:none!important}

/* ALUMATE design system — light corporate theme. Layout: public pages = top nav + hero; portals = navy sidebar + top bar + light-grey canvas. */
:root{
  --navy:#0B2D4A; --navy-2:#123B5F; --navy-3:#0F3555; --navy-50:#EAF0F5;
  --teal:#00A8A8; --teal-ink:#00797A; --teal-50:#E6F6F6; --teal-100:#C9ECEC;
  --silver:#C0C6CE; --grey:#F4F6F8; --white:#FFFFFF;
  --ink:#0F1E2E; --ink-2:#3B4B5C; --muted:#6B7A8A; --line:#E3E8EE; --line-2:#EEF2F5;
  --success:#10B981; --success-ink:#047857; --success-50:#E8F8F1;
  --warning:#F59E0B; --warning-ink:#B45309; --warning-50:#FEF5E6;
  --danger:#EF4444; --danger-ink:#B91C1C; --danger-50:#FDECEC;
  --info:#3B82F6; --info-ink:#1D4ED8; --info-50:#EBF2FE;
  --f:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,Arial,sans-serif;
  --f-ar:'IBM Plex Sans Arabic','Inter',system-ui,sans-serif;
  --f-brand:'Montserrat','Inter',system-ui,sans-serif;
  --r-sm:8px; --r:12px; --r-lg:16px; --r-xl:24px;
  --sh-xs:0 1px 2px rgba(11,45,74,.05);
  --sh-sm:0 1px 2px rgba(11,45,74,.04),0 2px 8px rgba(11,45,74,.05);
  --sh-md:0 4px 16px rgba(11,45,74,.08);
  --sh-lg:0 16px 40px rgba(11,45,74,.14);
  --h:44px;
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--grey);color:var(--ink);font:14px/1.55 var(--f);-webkit-font-smoothing:antialiased}
html[lang=ar] body{font-family:var(--f-ar)}
h1,h2,h3,h4,p{margin:0}
h1,h2,h3{text-wrap:balance;letter-spacing:-.015em;color:var(--navy)}
.h1{font-size:32px;line-height:40px;font-weight:700}
.h2{font-size:24px;line-height:32px;font-weight:600}
.h3{font-size:20px;line-height:28px;font-weight:600}
.h4{font-size:16px;line-height:24px;font-weight:600;color:var(--navy)}
.small{font-size:13px}.cap{font-size:12px;line-height:16px;color:var(--muted)}
.muted{color:var(--muted)}
.num,.tab{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,'SF Mono',Menlo,Consolas,monospace;font-size:.92em}
button{font:inherit;color:inherit;cursor:pointer}
a{color:var(--teal-ink)}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:16px}
.sp{flex:1}
.g{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr))}
.g>*,.split>*,.ev-wrap>*,.qa>*,.paths>*{min-width:0}
.split{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:16px;align-items:start}
@media (max-width:1100px){.split{grid-template-columns:1fr}}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:var(--h);padding:0 18px;border-radius:10px;border:1px solid transparent;font-weight:600;font-size:14px;white-space:nowrap;transition:background .15s,border-color .15s,box-shadow .15s,transform .15s}
.btn svg{width:17px;height:17px;flex:none}
.btn-p{background:var(--teal);color:#fff;box-shadow:0 2px 8px rgba(0,168,168,.28)}
.btn-p:hover{background:#00999A}
.btn-n{background:var(--navy);color:#fff}.btn-n:hover{background:var(--navy-2)}
.btn-s{background:#fff;color:var(--navy);border-color:var(--line)}.btn-s:hover{border-color:var(--navy)}
.btn-o{background:transparent;color:var(--teal-ink);border-color:var(--teal)}.btn-o:hover{background:var(--teal-50)}
.btn-g{background:transparent;color:var(--ink-2)}.btn-g:hover{background:var(--line-2)}
.btn-d{background:#fff;color:var(--danger-ink);border-color:#F3C4C4}.btn-d:hover{background:var(--danger-50)}
.btn-sm{height:34px;padding:0 12px;font-size:13px;border-radius:8px}
.btn-sm svg{width:15px;height:15px}
.btn-w{width:100%}
.btn[disabled]{opacity:.45;cursor:not-allowed;box-shadow:none}
.icon-btn{width:40px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;color:var(--ink-2);position:relative}
.icon-btn svg{width:18px;height:18px}
.icon-btn .dot{position:absolute;top:8px;inset-inline-end:9px;width:8px;height:8px;border-radius:50%;background:var(--danger);border:2px solid #fff}

/* Form controls */
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lbl{font-size:13px;font-weight:600;color:var(--ink-2)}
.field .hint{font-size:12px;color:var(--muted)}
.inp,select.inp,textarea.inp{height:var(--h);width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;padding:0 14px;font:inherit;font-size:14px;color:var(--ink);transition:border-color .15s,box-shadow .15s}
textarea.inp{height:auto;min-height:96px;padding:12px 14px;resize:vertical;line-height:1.5}
.inp:focus{outline:none;border-color:var(--teal);box-shadow:0 0 0 3px rgba(0,168,168,.15)}
.inp::placeholder{color:#9AA7B4}
.inp.err{border-color:var(--danger)}
.inp-ic{position:relative}
.inp-ic>svg{position:absolute;inset-inline-start:13px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:#93A1AF;pointer-events:none}
.inp-ic .inp{padding-inline-start:40px}
.form-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:16px}
.seg{display:inline-flex;background:var(--line-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;height:34px;padding:0 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--sh-xs)}
.msg-err{display:flex;gap:8px;align-items:flex-start;color:var(--danger-ink);background:var(--danger-50);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:500}
.msg-err svg{width:16px;flex:none;margin-top:2px}
.chk{display:flex;gap:10px;align-items:flex-start;font-size:14px;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--teal-ink);margin-top:2px;flex:none}

/* Cards, pills, tables */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-xs)}
.cp{padding:20px}
.ch{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.ch h3{font-size:16px;line-height:24px;font-weight:600}
.ch .cap{margin-top:2px}
.link{background:none;border:0;padding:0;color:var(--teal-ink);font-weight:600;font-size:13px;display:inline-flex;align-items:center;gap:4px}
.link svg{width:14px}
.pill{display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.pill i{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.p-ok{background:var(--success-50);color:var(--success-ink)}
.p-warn{background:var(--warning-50);color:var(--warning-ink)}
.p-bad{background:var(--danger-50);color:var(--danger-ink)}
.p-info{background:var(--info-50);color:var(--info-ink)}
.p-teal{background:var(--teal-50);color:var(--teal-ink)}
.p-navy{background:var(--navy-50);color:var(--navy)}
.p-neu{background:var(--line-2);color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{text-align:start;font-size:12px;font-weight:600;color:var(--muted);background:#F8FAFC;padding:12px 16px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 16px;border-bottom:1px solid var(--line-2);vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.clk{cursor:pointer}tr.clk:hover td{background:#F8FAFC}
td.c,th.c{text-align:center}td.e,th.e{text-align:end}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.who b{display:block;font-weight:600;color:var(--ink)}
.who small{display:block;font-size:12px;color:var(--muted)}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy-50);color:var(--navy);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.av.lg{width:56px;height:56px;font-size:18px}
.av.t{background:var(--teal);color:#fff}
.empty{padding:40px 20px;text-align:center;color:var(--muted)}
.empty svg{width:36px;height:36px;color:var(--silver);margin-bottom:8px}
.empty b{display:block;color:var(--ink-2);font-size:15px;margin-bottom:4px}

/* KPI */
.kpi{padding:18px 20px;display:flex;flex-direction:column;gap:10px;text-align:start;width:100%}
button.kpi{border:1px solid var(--line);cursor:pointer;transition:box-shadow .15s,transform .15s}
button.kpi:hover{box-shadow:var(--sh-md);transform:translateY(-1px)}
.kpi-h{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--muted);font-weight:500}
.kpi-i{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;flex:none}
.kpi-i svg{width:18px;height:18px}
.kpi b{font-size:28px;line-height:34px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.kpi .tr{font-size:12px;color:var(--muted)}.kpi .tr em{font-style:normal;font-weight:600;color:var(--success-ink)}
.ic-navy{background:var(--navy-50);color:var(--navy)}.ic-teal{background:var(--teal-50);color:var(--teal-ink)}
.ic-ok{background:var(--success-50);color:var(--success-ink)}.ic-warn{background:var(--warning-50);color:var(--warning-ink)}
.ic-info{background:var(--info-50);color:var(--info-ink)}.ic-bad{background:var(--danger-50);color:var(--danger-ink)}

/* Brand */
.wm{font-family:var(--f-brand);font-weight:600;letter-spacing:.12em;line-height:1;display:inline-flex;direction:ltr}
.wm b{color:var(--navy);font-weight:600}.wm i{font-style:normal;color:var(--teal)}
.wm.inv b{color:#fff}
.brand{display:flex;align-items:center;gap:10px;background:none;border:0;padding:0;direction:ltr}
.brand svg{height:34px;width:auto}
.brand .wm{font-size:19px}
.brand-st{display:flex;flex-direction:column;align-items:center;gap:12px}
.brand-st svg{width:92px;height:auto}
.brand-st .wm{font-size:28px}
.brand-st small{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:#9FB4C7}

/* Public top nav */
.pub{min-height:100%}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:rgba(255,255,255,.92);backdrop-filter:saturate(180%) blur(12px);-webkit-backdrop-filter:saturate(180%) blur(12px);border-bottom:1px solid var(--line)}
.nav-in{max-width:1240px;margin:0 auto;padding:12px 24px;display:flex;align-items:center;gap:24px}
.nav-l{display:flex;gap:4px;margin-inline-start:24px}
.nav-l button{background:none;border:0;padding:8px 12px;border-radius:8px;font-weight:500;color:var(--ink-2);font-size:14px}
.nav-l button:hover,.nav-l button.on{color:var(--navy);background:var(--line-2)}
.lang{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;height:36px}
.lang button{border:0;background:#fff;height:100%;padding:0 10px;font-size:12.5px;font-weight:600;color:var(--muted)}
.lang button.on{background:var(--navy);color:#fff}
.lang button:last-child{font-family:var(--f-ar)}
@media (max-width:860px){.nav-l{display:none}.nav-in{padding:10px 16px;gap:10px}}
.wrap{max-width:1240px;margin:0 auto;padding-inline:24px;padding-block:28px 56px}
@media (max-width:600px){.wrap{padding-inline:16px}}

/* Home */
.hero{position:relative;border-radius:var(--r-xl);overflow:hidden;min-height:440px;display:flex;align-items:center;box-shadow:var(--sh-lg);isolation:isolate}
.hero-art{position:absolute;inset:0;z-index:-2}
.hero-art svg{width:100%;height:100%;display:block}
.hero::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(90deg,rgba(11,45,74,.94) 0%,rgba(11,45,74,.78) 42%,rgba(11,45,74,.12) 78%)}
html[dir=rtl] .hero::before{background:linear-gradient(270deg,rgba(11,45,74,.94) 0%,rgba(11,45,74,.78) 42%,rgba(11,45,74,.12) 78%)}
.hero-c{padding:56px 48px;max-width:560px;color:#fff}
.hero-c .eb{font-size:12px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:#7FD8D8}
.hero-c h1{color:#fff;font-size:clamp(34px,5vw,52px);line-height:1.08;font-weight:700;margin:14px 0 16px;letter-spacing:-.025em}
.hero-c p{color:#C5D3E0;font-size:16px;line-height:1.6;max-width:44ch}
.hero-c .row{margin-top:28px}
.btn-glass{background:rgba(255,255,255,.08);color:#fff;border-color:rgba(255,255,255,.35)}.btn-glass:hover{background:rgba(255,255,255,.16)}
@media (max-width:700px){.hero{min-height:0}.hero-c{padding:36px 24px}.hero::before{background:linear-gradient(180deg,rgba(11,45,74,.7),rgba(11,45,74,.95))}}
.sec-t{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:40px 0 18px;flex-wrap:wrap}
.paths{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
@media (max-width:1000px){.paths{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.paths{grid-template-columns:1fr}}
.path{padding:22px;display:flex;flex-direction:column;gap:10px;text-align:start;transition:box-shadow .2s,transform .2s,border-color .2s}
.path:hover{box-shadow:var(--sh-md);transform:translateY(-2px);border-color:var(--teal-100)}
.path .pi{width:44px;height:44px;border-radius:12px;background:var(--navy-50);color:var(--navy);display:grid;place-items:center}
.path .pi svg{width:22px;height:22px}
.path h3{font-size:16px;line-height:24px;font-weight:600}
.path p{font-size:13px;color:var(--muted);min-height:40px}
.path .meta{display:flex;gap:6px;flex-wrap:wrap}
.path .btn{margin-top:auto;align-self:flex-start}
.band{margin-top:40px;background:var(--navy);border-radius:var(--r-lg);color:#fff;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));overflow:hidden}
.band div{display:flex;gap:14px;align-items:center;padding:22px 24px}
.band div+div{border-inline-start:1px solid rgba(255,255,255,.1)}
.band svg{width:22px;height:22px;color:var(--teal);flex:none}
.band b{display:block;font-size:14px}.band span{font-size:12.5px;color:#9FB4C7}
@media (max-width:800px){.band{grid-template-columns:1fr}.band div+div{border-inline-start:0;border-top:1px solid rgba(255,255,255,.1)}}
.foot{margin-top:40px;padding-top:20px;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

/* Sign-in */
.auth{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);min-height:calc(100vh - 61px);background:#fff}
@media (max-width:900px){.auth{grid-template-columns:1fr}.auth-v{min-height:300px}}
.auth-v{position:relative;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:40px;isolation:isolate}
.auth-v .hero-art{z-index:-2}
.auth-v::before{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(11,45,74,.82),rgba(11,45,74,.55) 45%,rgba(11,45,74,.94))}
.auth-v h2{color:#fff;font-size:30px;line-height:38px;font-weight:700;max-width:16ch;margin-top:28px}
.auth-v p{color:#C5D3E0;max-width:42ch;margin-top:10px}
.feat{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:24px;max-width:460px}

.stats{display:flex;gap:28px;flex-wrap:wrap}
.stats div{padding-inline-end:28px;border-inline-end:1px solid rgba(255,255,255,.18)}
.stats div:last-child{border:0}
.stats b{display:block;font-size:20px;font-weight:700}.stats span{font-size:12px;color:#9FB4C7}
.auth-f{display:flex;align-items:center;justify-content:center;padding:40px 24px;background:var(--grey)}
.auth-box{width:100%;max-width:400px}
.auth-box h1{font-size:26px;line-height:34px;font-weight:700}
.auth-box>p{color:var(--muted);margin-top:4px}
.tabs-u{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:24px 0 20px}
.tabs-u button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);font-size:14px;margin-bottom:-1px}
.tabs-u button.on{color:var(--navy);border-bottom-color:var(--teal)}
.auth-box form{display:flex;flex-direction:column;gap:16px}
.or{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:12px}.or::before,.or::after{content:"";flex:1;height:1px;background:var(--line)}
.demo{margin-top:24px;border:1px dashed #C9D3DD;border-radius:12px;padding:12px;background:#fff}
.demo p{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:8px}
.demo button{display:flex;width:100%;justify-content:space-between;gap:10px;background:none;border:0;padding:7px 8px;border-radius:8px;font-size:13px;text-align:start}
.demo button:hover{background:var(--line-2)}.demo button span{color:var(--muted);font-size:12px}
.otp{letter-spacing:.6em;text-align:center;font-size:20px;font-weight:600}
.code-pv{display:flex;gap:12px;align-items:center;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13px}

/* Portal shell */
.app{display:grid;grid-template-columns:248px minmax(0,1fr);min-height:100vh}
.side{background:var(--navy);color:#C8D5E2;display:flex;flex-direction:column;position:sticky;top:0;height:100vh;padding:20px 14px;overflow-y:auto}

.side .brand small{display:block;font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#7E97AD;margin-top:4px;font-family:var(--f)}
.snav{display:flex;flex-direction:column;gap:2px}
.snav button{display:flex;align-items:center;gap:12px;background:none;border:0;padding:0 12px;height:42px;border-radius:10px;font-weight:500;font-size:14px;color:#B9C8D6;text-align:start;width:100%}
.snav button svg{width:18px;height:18px;flex:none;opacity:.9}
.snav button:hover{background:rgba(255,255,255,.06);color:#fff}
.snav button.on{background:rgba(0,168,168,.16);color:#fff;box-shadow:inset 3px 0 0 var(--teal)}
html[dir=rtl] .snav button.on{box-shadow:inset -3px 0 0 var(--teal)}
.snav button.on svg{color:var(--teal)}
.snav .cnt{margin-inline-start:auto;font-size:11px;font-weight:700;background:rgba(255,255,255,.12);color:#fff;border-radius:999px;padding:1px 8px}
.side-b{margin-top:auto;padding-top:16px;border-top:1px solid rgba(255,255,255,.08)}
.main{min-width:0;display:flex;flex-direction:column}
.topb{position:sticky;top:0;z-index:20;height:68px;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:12px;padding:0 24px}
.topb .inp-ic{flex:1;max-width:380px}
.topb .inp{height:40px;background:var(--grey);border-color:transparent}
.me{display:flex;align-items:center;gap:10px;padding:4px 6px;border-radius:12px;background:none;border:0;text-align:start}
.me b{display:block;font-size:13px;color:var(--ink)}.me small{display:block;font-size:11.5px;color:var(--muted)}
.content{padding:28px;max-width:1360px;width:100%}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:24px}

.ph p{color:var(--muted);margin-top:2px}
.menu-btn{display:none}
@media (max-width:960px){
  .app{grid-template-columns:1fr}
  .side{position:fixed;inset-block:0;inset-inline-start:0;width:264px;z-index:60;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--sh-lg)}
  html[dir=rtl] .side{transform:translateX(100%)}
  .side.open,html[dir=rtl] .side.open{transform:none}
  .menu-btn{display:grid}

  .me div{display:none}
}
@media (max-width:600px){.topb .inp-ic{display:none}}
.scrim{position:fixed;inset:0;background:rgba(11,45,74,.4);z-index:55}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:20px;overflow-x:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;font-weight:600;color:var(--muted);white-space:nowrap;font-size:14px;margin-bottom:-1px}
.tabs button.on{color:var(--navy);border-bottom-color:var(--teal)}

/* Quick actions */
.qa{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:900px){.qa{grid-template-columns:repeat(2,minmax(0,1fr))}}
.qa button{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-weight:600;font-size:13.5px;color:var(--ink);text-align:start;transition:box-shadow .15s,border-color .15s}

/* Charts */

.donut svg{display:block}
.donut .dv{position:absolute;text-align:center}

.lgd{display:flex;gap:16px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.hb{display:grid;grid-template-columns:minmax(80px,160px) 1fr 36px;gap:12px;align-items:center;font-size:13px;padding:5px 0}

.vbl{display:flex;gap:10px;margin-top:8px}.vbl span{flex:1;text-align:center;font-size:11.5px;color:var(--muted)}
.lc svg{width:100%;height:auto;display:block}
.bar{height:8px;background:var(--line-2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--teal);border-radius:4px}

/* Journey stepper */
.jr{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));position:relative}
.jr div{display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center;position:relative;font-size:12.5px;color:var(--muted);padding:0 4px}
.jr div::before{content:"";position:absolute;top:15px;inset-inline-start:calc(-50% + 18px);width:calc(100% - 36px);height:2px;background:var(--line)}
.jr div:first-child::before{display:none}
.jr div.dn::before,.jr div.cu::before{background:var(--teal)}
.jr i{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:#fff;border:2px solid var(--line);color:var(--muted);font-style:normal;font-weight:700;font-size:13px;position:relative;z-index:1}
.jr i svg{width:15px}
.jr .dn i{background:var(--teal);border-color:var(--teal);color:#fff}
.jr .cu i{border-color:var(--teal);color:var(--teal-ink);box-shadow:0 0 0 5px var(--teal-50)}
.jr .cu b{color:var(--navy)}
.jr b{font-weight:600;color:var(--ink-2)}
@media (max-width:700px){.jr{grid-template-columns:repeat(3,minmax(0,1fr));row-gap:20px}.jr div:nth-child(4)::before{display:none}}
.cl{display:flex;flex-direction:column}
.cl>div{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.cl>div:last-child{border-bottom:0}
.cl .ci{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;flex:none}
.cl .ci svg{width:14px}
.ci.ok{background:var(--success-50);color:var(--success-ink)}.ci.pe{background:var(--warning-50);color:var(--warning-ink)}.ci.na{background:var(--line-2);color:var(--muted)}
.cl .tx{flex:1;min-width:0}.cl b{display:block;font-weight:600;font-size:14px}.cl small{color:var(--muted);font-size:12.5px}

/* Stepper (forms) */
.stp{display:flex;align-items:center;gap:8px;overflow-x:auto;padding-bottom:4px}
.stp button{display:flex;align-items:center;gap:10px;background:none;border:0;padding:6px 4px;font-size:13.5px;font-weight:600;color:var(--muted);white-space:nowrap}
.stp button i{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-style:normal;font-size:13px;background:#fff;flex:none}
.stp button i svg{width:14px}
.stp button.on{color:var(--navy)}.stp button.on i{border-color:var(--navy);background:var(--navy);color:#fff}
.stp button.dn{color:var(--ink-2)}.stp button.dn i{border-color:var(--teal);background:var(--teal);color:#fff}
.stp .ln{flex:1;min-width:20px;height:2px;background:var(--line)}
.stp .ln.dn{background:var(--teal)}

/* Evaluation form */
.ev-wrap{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:20px;align-items:start}
@media (max-width:1100px){.ev-wrap{grid-template-columns:1fr}}
.ev-side{position:sticky;top:92px;display:flex;flex-direction:column;gap:16px}
@media (max-width:1100px){.ev-side{position:static}}
.det{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:18px 24px}
.det span{display:block;font-size:12px;color:var(--muted);margin-bottom:2px}
.det b{font-weight:600;color:var(--ink)}
.area{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:#fff}
.area+.area{margin-top:14px}
.area-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:#F8FAFC;border-bottom:1px solid var(--line)}
.area-h b{color:var(--navy);font-size:14px}
.crit{padding:14px 16px;border-top:1px solid var(--line-2)}
.crit:first-of-type{border-top:0}
.crit-r{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.crit-r .nm{flex:1;min-width:200px;font-weight:500}
.rate{display:inline-flex;gap:6px}
.rate button{width:44px;height:40px;border-radius:10px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:14px;color:var(--ink-2);transition:all .12s}
.rate button:hover{border-color:var(--teal)}
.rate button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 2px 6px rgba(11,45,74,.25)}
.rate button.on[data-v="4"]{background:var(--teal);border-color:var(--teal)}
.rate-lbl{font-size:12px;color:var(--muted);min-width:150px}
.rate-lbl.on{color:var(--navy);font-weight:600}
.crit .cmt{margin-top:10px}
.crit .cmt .inp{height:38px;font-size:13px}
.scale-k{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-bottom:16px}
.scale-k div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:flex;gap:10px;align-items:center;font-size:12.5px}
.scale-k b{width:26px;height:26px;border-radius:8px;background:var(--navy);color:#fff;display:grid;place-items:center;flex:none;font-size:13px}
.scale-k div:first-child b{background:var(--teal)}
@media (max-width:700px){.scale-k{grid-template-columns:repeat(2,minmax(0,1fr))}}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:12px}
.calc div{border:1px solid var(--line);border-radius:12px;padding:14px 16px;background:#fff}
.calc span{display:block;font-size:12px;color:var(--muted)}
.calc b{display:block;font-size:24px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums;margin:2px 0}
.calc small{font-size:12px;color:var(--muted)}
.calc .ok{background:var(--success-50);border-color:#BDE9D6}.calc .ok b{color:var(--success-ink)}
.calc .wa{background:var(--warning-50);border-color:#F6DDB2}.calc .wa b{color:var(--warning-ink)}
.thr{position:relative;height:10px;border-radius:5px;background:var(--line-2);margin:28px 0 8px}
.thr i{position:absolute;inset-block:0;inset-inline-start:0;border-radius:5px;background:var(--teal)}
.thr em{position:absolute;top:-24px;font-style:normal;font-size:11px;font-weight:700;color:var(--navy);transform:translateX(-50%)}
html[dir=rtl] .thr em{transform:translateX(50%)}
.thr u{position:absolute;top:-6px;bottom:-6px;width:2px;background:var(--navy)}
.ro{border:1px dashed #C9D3DD;border-radius:10px;padding:12px 14px;font-size:13px;color:var(--muted);background:#FAFBFC;min-height:96px}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opts button{height:40px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:0 14px;font-size:13.5px;font-weight:600;color:var(--ink-2)}
.opts button.on{border-color:var(--teal);background:var(--teal-50);color:var(--teal-ink)}
.sigl{display:flex;flex-direction:column}
.sigl>div{display:flex;align-items:center;gap:14px;padding:14px 0;border-bottom:1px solid var(--line-2)}
.sigl>div:last-child{border-bottom:0}
.sigl .tx{flex:1}.sigl b{display:block;font-weight:600}.sigl small{color:var(--muted);font-size:12.5px}
.sbar{position:sticky;bottom:0;z-index:15;margin-top:20px;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:0 -4px 24px rgba(11,45,74,.08);padding:12px 16px;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.sbar .st{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.sbar .st b{color:var(--navy)}
.saved{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--success-ink)}
.saved svg{width:14px}
.ix{display:inline-grid;place-items:center;min-width:38px;height:26px;padding:0 6px;border-radius:7px;font-size:12px;font-weight:700;font-variant-numeric:tabular-nums}
.i-good{background:var(--success-50);color:var(--success-ink)}.i-mid{background:var(--warning-50);color:var(--warning-ink)}.i-low{background:var(--danger-50);color:var(--danger-ink)}
.i-due{border:1.5px dashed var(--warning);color:var(--warning-ink);font-size:11px}.i-now{background:var(--teal-50);color:var(--teal-ink);font-size:11px}.i-fut{background:var(--line-2)}
.ack{border:1px solid var(--teal-100);background:var(--teal-50);border-radius:var(--r);padding:16px}

/* Drawer & modal */
.drawer{position:fixed;inset-block:0;inset-inline-end:0;width:min(560px,100%);background:var(--grey);z-index:61;overflow-y:auto;box-shadow:var(--sh-lg)}
.dr-h{position:sticky;top:0;z-index:2;background:#fff;border-bottom:1px solid var(--line);padding:18px 20px;padding-top:calc(18px + env(safe-area-inset-top,0px));display:flex;gap:14px;align-items:center}
.dr-h h3{font-size:18px}.dr-h small{color:var(--muted)}
.dr-b{padding:20px;display:flex;flex-direction:column;gap:16px}
.kv{display:grid;grid-template-columns:150px 1fr;font-size:13.5px}
.kv dt{color:var(--muted);padding:9px 0;border-bottom:1px solid var(--line-2)}
.kv dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line-2);font-weight:500;min-width:0}
.log>div{display:grid;grid-template-columns:96px 1fr;gap:12px;font-size:13px;padding:8px 0;border-bottom:1px dashed var(--line)}
.log>div:last-child{border:0}.log span{color:var(--muted)}
.modal{position:fixed;inset:0;z-index:66;display:grid;place-items:center;padding:16px}
.mb{background:#fff;border-radius:var(--r-lg);width:100%;max-width:480px;max-height:90vh;overflow:auto;box-shadow:var(--sh-lg)}
.mb-h{padding:20px 20px 0;display:flex;gap:12px;align-items:flex-start}
.mb-h h3{font-size:18px}
.mb-c{padding:16px 20px;display:flex;flex-direction:column;gap:12px}
.mb-f{padding:16px 20px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap}
.bub{background:var(--line-2);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:13.5px}
.bub[dir=rtl]{font-family:var(--f-ar);border-radius:16px 16px 4px 16px}
.toast{position:fixed;inset-inline-start:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 18px;border-radius:12px;font-weight:600;font-size:13.5px;z-index:90;box-shadow:var(--sh-lg);display:flex;gap:10px;align-items:center;max-width:calc(100% - 32px)}
html[dir=rtl] .toast{transform:translateX(50%)}
.toast svg{width:18px;color:var(--teal)}

/* Capacity & cohort */
.capc{padding:18px;display:flex;flex-direction:column;gap:12px}
.cap-n{display:grid;grid-template-columns:repeat(3,1fr);text-align:center;gap:6px}
.cap-n b{display:block;font-size:20px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.cap-n span{font-size:11px;color:var(--muted)}
.seats{display:flex;gap:4px;flex-wrap:wrap}.seats i{width:14px;height:14px;border-radius:4px;background:var(--navy)}.seats i.f{background:#fff;border:1.5px solid var(--teal)}
.mxe th.c{line-height:1.2}.mxe th small{display:block;font-weight:500;font-size:10.5px}.mxe td.c{padding:10px 4px}
.prof dl{display:grid;grid-template-columns:100px 1fr;gap:6px 12px;margin:14px 0;font-size:13px}
.prof dt{color:var(--muted)}.prof dd{margin:0;min-width:0}
.rule{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.5fr);gap:20px;align-items:center}
@media (max-width:800px){.rule{grid-template-columns:1fr}}
.tiers{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.tiers div{border:1px solid var(--line);border-radius:10px;padding:10px 6px;text-align:center}
.tiers .top{border-color:#BDE9D6;background:var(--success-50)}
.tiers b{display:block;font-size:18px;color:var(--navy)}.tiers span{font-size:11px;color:var(--muted)}
@media (max-width:520px){.tiers{grid-template-columns:repeat(2,minmax(0,1fr))}}
.lk{display:flex;gap:8px}.lk .inp{height:40px;font-size:13px}

/* Report (A4) */
.rep{position:fixed;inset:0;z-index:80;background:#E7EBEF;overflow:auto}
.rep-bar{position:sticky;top:0;z-index:2;display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.a4{width:min(210mm,calc(100% - 32px));margin:24px auto 48px;background:#fff;color:var(--ink);padding:15mm 15mm 12mm;box-shadow:var(--sh-lg);font-size:11.5px;line-height:1.5;direction:ltr;text-align:left;font-family:var(--f)}
.a4 h1,.a4 h2{color:var(--navy)}
.rh{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-bottom:12px;border-bottom:3px solid var(--navy)}
.rh .brand svg{height:34px}.rh .brand .wm{font-size:16px}
.rh-r{text-align:right;font-size:10.5px;color:var(--muted)}
.rtl{padding:16px 0 4px}.rtl h1{font-size:22px;margin:4px 0}.rtl p{color:var(--muted)}.rtl b{color:var(--ink)}
.rtl .eb{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--teal-ink)}
.rs{margin-top:14px}.rs h2{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal-ink);padding-bottom:5px;margin-bottom:6px;border-bottom:1px solid var(--line)}
.rs2{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:640px){.rs2{grid-template-columns:1fr}.a4{padding:20px 16px}}
.rkv{width:100%;font-size:11.5px}.rkv th{background:none;border:0;padding:3px 10px 3px 0;color:var(--muted);font-weight:500;font-size:11.5px;width:40%;white-space:normal}.rkv td{border:0;padding:3px 0;font-weight:500}
.rk{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rk div{border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#F8FAFC}
.rk b{display:block;font-size:18px;color:var(--navy);font-variant-numeric:tabular-nums}.rk span{font-size:10px;color:var(--muted)}
.rt{width:100%;font-size:10.5px}.rt th{background:var(--navy);color:#fff;font-size:10px;padding:6px 8px;border:0}.rt td{padding:5px 8px;font-variant-numeric:tabular-nums}
.rt tr.tot td{background:#F4F6F8;font-weight:700}
.rb{display:grid;grid-template-columns:1fr 100px 34px;gap:8px;align-items:center;padding:3px 0}.rb i{height:7px;border-radius:4px;background:var(--line-2);overflow:hidden}.rb em{display:block;height:100%;background:var(--teal)}.rb b{text-align:right}
.rf{margin-bottom:6px}.rf b{display:block;color:var(--navy);font-size:10.5px}
.ru{margin:0;padding-left:16px}.ru li{padding:1px 0}.ru span{color:var(--muted);margin-left:6px;font-size:10px}
.rsg{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:28px}.rsg div{border-top:1px solid #8E98A4;padding-top:6px;font-size:10.5px;color:var(--muted)}.rsg b{display:block;color:var(--ink);font-size:11.5px}
.rc{margin-top:16px;font-size:9.5px;color:var(--muted);text-align:center}

/* Certificate */
.cert{border:2px solid var(--navy);outline:1px solid var(--silver);outline-offset:-10px;border-radius:6px;padding:32px 24px;text-align:center;background:#fff}
.cert h3{font-size:24px;margin:12px 0 4px}.cert .nm{font-size:22px;font-weight:700;color:var(--teal-ink);margin:10px 0}
.cert .sg{display:flex;justify-content:space-around;gap:12px;margin-top:24px;font-size:12px;color:var(--muted)}.cert .sg div{border-top:1px solid var(--silver);padding-top:6px;min-width:120px}

@media (prefers-reduced-motion:no-preference){
  .drawer{animation:dr .22s ease-out}.mb{animation:pop .18s ease-out}.content>*{animation:fade .25s ease-out}
  @keyframes dr{from{transform:translateX(24px);opacity:.6}}@keyframes pop{from{transform:scale(.97);opacity:.6}}@keyframes fade{from{opacity:.4;transform:translateY(4px)}}
}
@media print{
  @page{size:A4;margin:0}
  body *{visibility:hidden}
  .a4,.a4 *{visibility:visible}
  .rep{position:static;background:#fff;overflow:visible}
  .a4{position:absolute;left:0;top:0;width:210mm;margin:0;box-shadow:none}
  .a4 *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}

/* Home: numbers band */
.nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:40px}
.nums .card{padding:22px 20px;text-align:center}
.nums b{display:block;font-size:30px;line-height:38px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
.nums span{font-size:13px;color:var(--muted)}
@media (max-width:800px){.nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* Home: FAQ */
.faq{display:flex;flex-direction:column;gap:10px}
.faq details{background:#fff;border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh-xs)}
.faq summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:12px;padding:16px 20px;font-weight:600;color:var(--navy)}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";margin-inline-start:auto;font-size:20px;line-height:1;color:var(--teal-ink)}
.faq details[open] summary::after{content:"−"}
.faq details p{padding:0 20px 18px;color:var(--ink-2)}
/* Site footer */
.ft{margin-top:48px;padding-top:32px;border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1.4fr) repeat(3,minmax(0,1fr));gap:28px}
.ft h4{font-size:13px;font-weight:600;color:var(--navy);margin-bottom:10px}
.ft p{font-size:13px;color:var(--muted);margin-top:10px;max-width:34ch}
.ft ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.ft li{font-size:13px;color:var(--ink-2)}
.ft li button,.ft li a{background:none;border:0;padding:0;font-size:13px;color:var(--ink-2);text-decoration:none;text-align:start}
.ft li button:hover,.ft li a:hover{color:var(--teal-ink)}
.ft-b{grid-column:1/-1;display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:18px;margin-top:4px;border-top:1px solid var(--line-2);font-size:12.5px;color:var(--muted)}
.ft-b nav{display:flex;gap:16px}
.ft-b button{background:none;border:0;padding:0;font-size:12.5px;color:var(--muted)}.ft-b button:hover{color:var(--teal-ink)}
@media (max-width:860px){.ft{grid-template-columns:repeat(2,minmax(0,1fr))}.ft>div:first-child{grid-column:1/-1}}
/* Notifications panel */
.ntf-w{position:relative}
.ntf{position:absolute;top:calc(100% + 8px);inset-inline-end:0;width:min(360px,calc(100vw - 32px));background:#fff;border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--sh-lg);z-index:40;overflow:hidden}
.ntf-h{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.ntf-h b{color:var(--navy)}
.ntf button.al{width:100%;background:#fff;border:0;border-top:1px solid var(--line-2);text-align:start;padding:12px 16px}
.ntf button.al:first-of-type{border-top:0}
.ntf button.al:hover{background:#F8FAFC}
.ntf .empty{padding:28px 16px}
@media (max-width:600px){.ntf{position:fixed;top:72px;inset-inline:16px;width:auto}}
/* Concept guide ("What do these mean?") under each portal page title */
.gd{margin-bottom:16px}
.gd summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:10px;padding:12px 16px;color:var(--navy);font-size:13.5px}
.gd summary::-webkit-details-marker{display:none}
.gd summary svg{width:18px;height:18px;color:var(--teal-ink);flex:none}
.gd summary::after{content:"+";margin-inline-start:auto;font-size:18px;line-height:1;color:var(--teal-ink)}
.gd[open] summary::after{content:"−"}
.gd dl{margin:0;padding:4px 16px 16px;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr));gap:12px 28px;border-top:1px solid var(--line-2);padding-top:14px}
.gd dl>div{display:flex;gap:10px;align-items:flex-start;font-size:13px;line-height:1.5}
.gd dt{flex:none;min-width:30px;display:flex;justify-content:center}
.gd dd{margin:0;color:var(--ink-2)}.gd dd b{color:var(--navy);font-weight:600}
.gd .ci{width:24px;height:24px}.gd .ci svg{width:13px}.gd .ix{min-width:34px;height:24px}
/* Applicants: where everyone is */
.stg-s{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px}
.stg-s button{flex:none;min-width:104px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 12px;text-align:start;box-shadow:var(--sh-xs)}
.stg-s button.on{border-color:var(--teal);box-shadow:0 0 0 3px var(--teal-50)}
.stg-s small{display:block;font-size:11px;color:var(--muted)}

function rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

function emailBase(name){const p=name.split(' ');return (p[0][0]+'.'+p.slice(2).join('').replace(/^Al/,'al')).toLowerCase()}
function mk(o){
  const g=R()<.45?'F':'M';
  const name=`${pick(g==='F'?FF:FM)} ${pick(FATHER)} ${pick(FAM)}`;
  const r={id:'SA-'+(SEQ++),name,g,civil:String(ri(10000000,39999999)),phone:'9'+ri(1000000,9999999),
    uni:pick(UNIS),major:o.major||pick(ALL_MAJORS),gpa:(2.5+R()*1.45).toFixed(2),graduated:false,gradYear:pick([2026,2027,2027,2028]),
    reqGrad:R()<.6,declaredBefore:R()<.15,histFound:false,track:o.track,intake:o.intake,stage:o.stage,dept:o.dept||null,sup:null,
    start:o.start||null,end:o.end||null,applied:o.applied,accepted:o.accepted||null,iq:null,pers:null,interview:null,ref:null,
    pre:{},evals:[],sessions:[],plan:[],post:{},log:[],bank:pick(['Bank Muscat','Bank Dhofar','National Bank of Oman','Sohar International','Bank Nizwa','Oman Arab Bank']),
    acct:String(ri(1000,9999)),ppeSize:null,medDate:null,medTime:null,medSms:false,medResult:null,feedback:null,reason:null};
  r.pemail=emailBase(name)+'@gmail.com';
  if(o.graduate){r.graduated=true;r.gradYear=2025;r.reqGrad=false}
  if(o.track==='Referral'){const d=pick(DEPTS),s=pick(d.s);r.ref={empId:s[1].replace('E-','E-3'),empName:`${pick(FM)} ${pick(FATHER)} ${r.name.split(' ').slice(2).join(' ')}`,rel:pick(['Son / Daughter','Brother / Sister','Nephew / Niece'])}}
  ALL.push(r);return r;
}
function trainedBefore(r){return r.declaredBefore||r.histFound}
function priority(r){
  if(r.track==='Eidaad')return null;
  const a=r.reqGrad, b=!trainedBefore(r);
  return a&&b?'High':(a||b)?'Medium':'Standard';
}
function score(r){return r.iq==null?null:Math.round(r.iq*.6+r.pers*.4)}
function assign(r,ignoreCap){
  const soft=6;
  let opts=DEPTS.filter(d=>d.m.includes(r.major)&&(ignoreCap||LOAD[d.n]<soft));
  if(!opts.length)opts=DEPTS.filter(d=>ignoreCap||LOAD[d.n]<soft);
  opts.sort((a,b)=>LOAD[a.n]-LOAD[b.n]);
  const d=opts[0]; r.dept=d.n; if(!ignoreCap)LOAD[d.n]++;
  r.major=d.m.includes(r.major)?r.major:pick(d.m);
}
function setSup(r){if(r.dept){const s=pick(deptOf(r.dept).s);r.sup={name:s[0],id:s[1]};r.mentor={name:`${pick(R()<.5?FF:FM)} ${pick(FATHER)} ${pick(FAM)}`,id:'E-'+ri(24000,27999)}}}
function setPre(r,p){
  const ops=OPS.includes(r.dept);
  PRE.forEach(([k])=>{
    if(k==='ppe'&&!ops){r.pre[k]='na';return}
    if(k==='laptop'&&ops){r.pre[k]='na';return}
    if(k==='medical'){r.pre[k]='done';return}
    r.pre[k]=R()<p?'done':'pending';
  });
  if(ops)r.ppeSize={coverall:pick(['M','L','XL']),shoes:ri(39,45)};
  r.cemail=emailBase(r.name)+'@trainee.sohar-alu.om';
}
function monthsOf(start,last){const out=[];let d=new Date(start.getFullYear(),start.getMonth(),1);while(d<=last){out.push(new Date(d));d=new Date(d.getFullYear(),d.getMonth()+1,1)}return out}
function mkEval(r,month,q,idx){
  const sc=COMP.map(()=>clamp(Math.round(q+.45+(R()-.4)*1.1+idx*.08),2,4));
  const sched=ri(20,22),abs=R()<.75?ri(0,2):R()<.8?ri(3,4):ri(5,7);const exc=abs>0&&R()<.4?Math.min(abs,ri(1,2)):0;
  const avg=sc.reduce((a,b)=>a+b,0)/sc.length;const c=allowCalc(sched,sched-abs,exc,avg);
  const isFinal=r.end&&mlabel(r.end)===mlabel(month);
  return {month:mlabel(month),type:isFinal?'Final evaluation':'Monthly review',sched,attended:sched-abs,excused:exc,idx:c.idx,attPct:c.att,att:c.ti,scores:sc,cmts:COMP.map(()=>''),avg,final:Math.round(avg/4*100),
    strengths:pick(STRENGTHS),develop:pick(DEVELOP),mentorFb:pick(MENTOR_FB),traineeCmt:R()<.4?'Thank you, I learned a lot this month.':'',
    completion:isFinal?(avg>=2.5?COMPLETION[0]:COMPLETION[1]):null,rec:isFinal?(avg>=3.3?RECS[0]:avg>=2.5?RECS[1]:RECS[2]):null,
    by:r.sup?r.sup.name:'',sign:{sup:true,mentor:true,trainee:true,hr:true}};
}
function fillEvals(r,uptoDate,q){
  const last=uptoDate<r.end?uptoDate:r.end;
  monthsOf(r.start,last).forEach((m,i)=>r.evals.push(mkEval(r,m,q,i)));
  const le=r.evals[r.evals.length-1];if(le&&r.stage==='Training'){le.sign.trainee=R()<.5;le.sign.hr=R()<.4;if(!le.sign.trainee)le.traineeCmt=''}
}
function setSessions(r){SESSIONS.forEach(([n,d],i)=>{if(i===0){r.sessions.push({n,d:r.start,done:r.start<=TODAY});return}
  if(d>=r.start&&d<=r.end)r.sessions.push({n,d,done:d<=TODAY&&R()<.88})})}
function setPlan(r){
  const base=OPS.includes(r.dept)?OPS_PLAN:OFF_PLAN;
  const prog=r.stage==='Completed'?1:r.stage==='Training'?clamp((TODAY-r.start)/(r.end-r.start),0,1):0;
  r.plan=base.map((t,i)=>({t,done:i<Math.round(prog*base.length)}));
}
function lg(r,d,who,what){r.log.push({d,who,what})}
function baseLog(r){
  lg(r,r.applied,'Applicant','Application submitted ('+TRACK[r.track].name+')');
  const si=STAGES.indexOf(r.stage);
  if(r.stage!=='Applied')lg(r,addDays(r.applied,3),pick(HRS),'Documents reviewed · moved to '+(TRACK[r.track].test?'Assessment':'Interview'));

  if(r.stage==='Training'||r.stage==='Completed')lg(r,r.start,'System','Training started · Supervisor '+r.sup.name);
  if(r.stage==='Completed')lg(r,r.end,'System','Training completed');
}

  const back=R()>.09;r.post={ppe:OPS.includes(r.dept)?(back?'done':'pending'):'na',card:back?'done':'pending',laptop:OPS.includes(r.dept)?'na':'done',feedback:R()<.75?'done':'pending',cert:back?'done':'pending'};
  if(r.post.feedback==='done')r.feedback={rating:ri(3,5),text:''};}

  const pts=evals.map((e,i)=>[x(i),y(e.avg)]);const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');

  return `<div class="lc"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${t('Average rating by month')}"><defs><linearGradient id="lcg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#00A8A8" stop-opacity=".22"/><stop offset="1" stop-color="#00A8A8" stop-opacity="0"/></linearGradient></defs>${grid}${area}<path d="${path}" fill="none" stroke="#00A8A8" stroke-width="2.5" stroke-linejoin="round"/>${pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===n-1?5:3.5}" fill="${i===n-1?'#0B2D4A':'#fff'}" stroke="#0B2D4A" stroke-width="2"/><text x="${p[0]}" y="${p[1]-10}" text-anchor="middle" font-size="10.5" font-weight="700" fill="#0B2D4A">${evals[i].avg.toFixed(1)}</text><text x="${p[0]}" y="${H-8}" text-anchor="middle" font-size="10.5" fill="#6B7A8A">${fms(evals[i].month)}</text>`).join('')}</svg></div>`;
}

function evNew(r){const month=dueMonths(r)[0];const key=r.id+'|'+month;if(S.drafts[key])return S.drafts[key];
  return S.drafts[key]={id:r.id,month,step:0,sched:22,attended:'',excused:0,scores:Array(COMP.length).fill(null),cmts:Array(COMP.length).fill(''),open:{},strengths:'',develop:'',mentorFb:'',completion:null,rec:null,confirm:false,saved:null,err:''}}
function evCalc(E){const filled=E.scores.filter(v=>v!=null).length,avg=filled?E.scores.reduce((a,b)=>a+(b||0),0)/filled:null;
  const sched=Number(E.sched)||0,att=E.attended===''?null:Number(E.attended),exc=Number(E.excused)||0;
  const attOk=att!=null&&sched>0&&att>=0&&exc>=0&&att+exc<=sched;const cc=attOk&&avg!=null&&filled===COMP.length?allowCalc(sched,att,exc,avg):null;
  return {filled,avg,sched,att,exc,attOk,cc,attPct:attOk?Math.min(100,(att+exc)/sched*100):null}}

'How long is the training?':'كم مدة التدريب؟','Summer, Winter and Family Referral placements last two months. The Eidaad Programme lasts ten months.':'التدريب الصيفي والشتوي وترشيح الأقارب مدته شهران، وبرنامج إعداد مدته عشرة أشهر.',

'Which documents do I need?':'ما المستندات المطلوبة؟','Your CV, transcript and a copy of your Civil ID. If the training is required for your graduation, add the training letter from your university.':'السيرة الذاتية وكشف الدرجات ونسخة البطاقة الشخصية. وإذا كان التدريب شرطاً لتخرجك، أضف رسالة التدريب من جامعتك.',
'How are trainees selected?':'كيف يتم اختيار المتدربين؟','Applicants take a short online assessment. HR gives priority to students who need the training to graduate and to first-time trainees. Eidaad candidates are interviewed by the department.':'يؤدي المتقدمون اختباراً إلكترونياً قصيراً، وتعطي الموارد البشرية الأولوية لمن يحتاج التدريب للتخرج ولمن يتدرب لأول مرة. أما مرشحو إعداد فيقابلهم القسم.',
'How will I know my result?':'كيف أعرف النتيجة؟','Every update reaches you by SMS and email. Once you pass the medical check-up, you can sign in to the Trainee Portal with your Civil ID.':'تصلك كل التحديثات عبر SMS والبريد الإلكتروني. وبعد اجتياز الفحص الطبي يمكنك الدخول إلى بوابة المتدرب برقمك المدني.',

/* ============ Drawer ============ */
function nextStage(r){const o=r.track==='Eidaad'?['Applied','Under Review','Interview','Selected','Medical']:['Applied','Under Review','Assessment','Selected','Medical'];const i=o.indexOf(r.stage);return i>=0&&i<o.length-1?o[i+1]:null}
function drawer(){
  const r=byId(S.drawer);if(!r)return '';const p=priority(r),le=r.evals[r.evals.length-1],ns=nextStage(r),act=PIPE.includes(r.stage)&&r.stage!=='Medical';
  const kv=[['Trainee number',`<span class="mono">${r.id}</span>`],['University / College',esc(t(r.uni))+(r.college?' · '+t(r.college):'')],['Major',esc(t(r.major))],['Graduation year',r.gradYear+' · '+t(r.graduated?'Graduated':'Expected')],['Programme',trk(r.track)],['Department',r.dept?dn(r.dept):'—'],['Supervisor',r.sup?esc(r.sup.name)+' · '+r.sup.id:'—'],['Mentor',r.mentor?esc(r.mentor.name):'—'],['Start date',fd(r.start)],['End date',fd(r.end)],['Status',stagePill(r.stage)],['Monthly allowance',STIPEND[r.track]+' OMR'+(le?` · ${t('last month')} ${payOf(r,le).toFixed(0)} OMR`:'')],['Bank',r.pre.bank==='done'?esc(r.bank)+' · '+mask(r.acct):'<span class="muted">'+t('Not provided')+'</span>'],['Required documents',r.pre.docs==='done'?pill(t('Complete'),'ok'):pill(t('Pending'),'warn')],['Access / ID card',r.pre.card==='done'?pill(t('Issued'),'ok'):pill(t('Pending'),'warn')]];
  return `<div class="scrim" data-act="close"></div><aside class="drawer" role="dialog" aria-label="${t('Trainee profile')}"><div class="dr-h">${avatar(r.name,'t')}<div style="flex:1;min-width:0"><h3>${esc(r.name)}</h3><small>${trk(r.track)} · ${esc(r.intake)}</small></div><button class="icon-btn" data-act="close" aria-label="${t('Close')}">${I.x}</button></div>
  <div class="dr-b">
  ${act?`<div class="card cp row"><div><span class="cap">${t('Current stage')}</span><div style="margin-top:4px">${stagePill(r.stage)}</div></div><span class="sp"></span>${ns?`<button class="btn btn-p btn-sm" data-act="adv" data-id="${r.id}">${tt('Move to {s}',{s:t(ns)})}</button>`:''}<button class="btn btn-d btn-sm" data-act="rej" data-id="${r.id}">${t('Not selected')}</button></div>`:''}
  ${(r.stage==='Training'||r.stage==='Completed')&&r.evals.length?`<div class="card cp row"><span class="kpi-i ic-navy">${I.file}</span><b style="flex:1">${t('Progress reports')}</b><button class="btn btn-n btn-sm" data-act="rep" data-id="${r.id}" data-v="uni">${t('University')}</button>${r.track==='Eidaad'?`<button class="btn btn-s btn-sm" data-act="rep" data-id="${r.id}" data-v="bdo">BDO</button>`:''}</div>`:''}
  ${r.track!=='Eidaad'?`<div class="card cp"><div class="ch" style="margin-bottom:8px"><h3>${t('Priority')}</h3>${priPill(p)}</div><div class="cl"><div>${r.reqGrad?`<span class="ci ok">${I.check}</span>`:`<span class="ci na">${ic('x')}</span>`}<span class="tx small">${t('Training required for graduation')}</span></div><div>${!trainedBefore(r)?`<span class="ci ok">${I.check}</span>`:`<span class="ci na">${ic('x')}</span>`}<span class="tx small">${r.histFound?t('Trained here before · found in history by Civil ID'):trainedBefore(r)?t('Trained here before'):t('First training at Sohar Aluminium')}</span></div></div>
    ${score(r)!=null?`<p class="small" style="margin-top:10px">${t('Assessment score')} <b>${score(r)}</b> <span class="cap">IQ ${r.iq} · ${t('Personality')} ${r.pers} · GPA ${r.gpa}</span></p>`:''}</div>`:`<div class="card cp"><span class="cap">${t('Department interview')}</span><p style="margin-top:4px"><b>${r.interview??'—'} / 100</b> ${r.reason?'· '+esc(r.reason):''}</p></div>`}
  ${r.ref?`<div class="card cp"><span class="cap">${t('Referral')}</span><p style="margin-top:4px">${esc(r.ref.empName)} · <span class="mono">${esc(r.ref.empId)}</span> · ${t(r.ref.rel)}</p></div>`:''}
  <div class="card cp"><div class="ch"><h3>${t('Trainee record')}</h3></div><dl class="kv">${kv.map(([k,v])=>`<dt>${t(k)}</dt><dd>${v}</dd>`).join('')}</dl></div>
  ${r.evals.length?`<div class="card cp"><div class="ch"><h3>${t('Evaluations')}</h3><span class="cap">${t('Average')} ${mean(r.evals.map(e=>e.avg)).toFixed(2)} / 4</span></div>${lineChart(r.evals)}

  <div class="card cp"><div class="ch"><h3>${t('Contact')}</h3></div><dl class="kv"><dt>${t('Civil ID')}</dt><dd class="mono">${mask(r.civil)}</dd><dt>${t('Mobile')}</dt><dd class="mono">+968 ${r.phone}</dd><dt>${t('Email')}</dt><dd>${esc(r.cemail||r.pemail)}</dd></dl></div>
  <div class="card cp"><div class="ch"><h3>${t('Activity log')}</h3></div><div class="log">${r.log.slice().reverse().map(l=>`<div><span class="num">${fd(l.d)}</span><p><b style="font-weight:600">${esc(l.who)}</b> · ${esc(l.what)}</p></div>`).join('')}</div></div></div></aside>`;
}

/* ============ Modals ============ */
function modal(){const M=S.modal;if(!M)return '';let h='',c='',f='';
  if(M.type==='sms'){const r=byId(M.id);h=t('Medical appointment SMS');c=`<p class="small muted">${t('To')} <b class="mono" style="color:var(--ink)">+968 ${r.phone}</b> · ${esc(r.name)}</p><div class="bub" dir="ltr">Dear ${esc(r.name.split(' ')[0])}, please attend your medical check-up at the Sohar Aluminium Medical Centre on <b>${fmt(r.medDate)}</b> at <b>${r.medTime}</b>. Bring your Civil ID.</div><div class="bub" dir="rtl">عزيزي/عزيزتي ${esc(r.name.split(' ')[0])}، نرجو حضورك للفحص الطبي في المركز الطبي بصحار ألمنيوم بتاريخ <b>${fd(r.medDate)}</b> الساعة <b>${r.medTime}</b>. يرجى إحضار البطاقة الشخصية.</div><p class="cap">${t('Demo only. No SMS is sent.')}</p>`;f=`<button class="btn btn-s" data-act="close-m">${t('Cancel')}</button><button class="btn btn-p" data-act="med-send" data-id="${r.id}">${I.send} ${t('Send SMS')}</button>`}
  if(M.type==='doc'){const pr=M.v==='privacy';h=t(pr?'Privacy':'Terms of use');c=(pr?['We use your details only to process your training application and placement.','Your Civil ID is shown masked, and each role sees only the data it needs.','Records are kept by HR Training and are not shared outside Sohar Aluminium, except reports sent to your university or BDO.']:['This is a demonstration version with sample data. Please do not enter real personal information.','Information you give must be accurate. False information can end an application or a placement.','Trainees follow Sohar Aluminium safety rules and site policies throughout the placement.']).map(x=>`<p class="small">${t(x)}</p>`).join('');f=`<button class="btn btn-p" data-act="close-m">${t('Close')}</button>`}
  if(M.type==='ev'){const r=byId(M.id),e=r.evals[M.i];h=`${esc(r.name)} · ${fm(e.month)}`;c=`<div class="row"><span class="h2">${e.avg.toFixed(2)}</span><span class="muted">/ 4</span><span class="sp"></span>${pill(t(e.type),'navy')}</div>${evDetail(r,e)}`;f=`<button class="btn btn-s" data-act="close-m">${t('Close')}</button>${S.portal==='h'&&!e.sign.hr?`<button class="btn btn-p" data-act="ev-hr" data-id="${r.id}" data-v="${M.i}">${t('Sign as HR')}</button>`:''}`}
  return `<div class="scrim" data-act="close-m" style="z-index:65"></div><div class="modal"><div class="mb" role="dialog" aria-label="${esc(h)}" style="${M.type==='ev'?'max-width:640px':''}"><div class="mb-h"><h3 style="flex:1">${h}</h3><button class="icon-btn" data-act="close-m" aria-label="${t('Close')}">${I.x}</button></div><div class="mb-c">${c}</div><div class="mb-f">${f}</div></div></div>`}

  <section class="rs"><h2>Monthly record</h2><table class="rt"><tr><th>Month</th><th>Days attended</th><th>Excused</th><th>Attendance</th><th>Rating</th><th>Index</th>${to==='bdo'?'<th>Allowance</th><th>Amount (OMR)</th>':''}</tr>
  ${E.map(e=>`<tr><td>${e.month}</td><td>${e.attended} / ${e.sched}</td><td>${e.excused||0}</td><td>${Math.round(e.attPct)}%</td><td>${e.avg.toFixed(2)}</td><td>${e.idx.toFixed(1)}%</td>${to==='bdo'?`<td>${TIERS[e.att].p}%</td><td>${(STIPEND[r.track]*TIERS[e.att].p/100).toFixed(0)}</td>`:''}</tr>`).join('')}${to==='bdo'?`<tr class="tot"><td colspan="7">Total allowance paid</td><td>${E.reduce((a,e)=>a+STIPEND[r.track]*TIERS[e.att].p/100,0).toFixed(0)}</td></tr>`:''}</table></section>
  <section class="rs rs2"><div><h2>Competency summary</h2>${ar.map(([a,v])=>`<div class="rb"><span>${a}</span><i><em style="width:${v/4*100}%"></em></i><b>${v.toFixed(2)}</b></div>`).join('')}<p class="cap" style="font-size:9.5px;margin-top:4px">Scale 1–4 · 4 exceeds expectations · 3 meets expectations</p></div>
  <div><h2>Supervisor feedback · ${le?le.month:''}</h2><p class="rf"><b>Key strengths</b>${esc(le?le.strengths:'—')}</p><p class="rf"><b>Areas for development</b>${esc(le?le.develop:'—')}</p><p class="rf"><b>Mentor</b>${esc(le?le.mentorFb:'—')}</p></div></section>
  <section class="rs rs2"><div><h2>Training sessions attended</h2><ul class="ru">${ses.map(x=>`<li>${esc(x.n)}<span>${typeof x.d==='string'?x.d:fmt(x.d)}</span></li>`).join('')||'<li>—</li>'}</ul></div><div><h2>${r.project?'Department project':'Department plan'}</h2>${r.project?`<p class="rf"><b>${esc(r.project.t)}</b>Status: ${r.project.st}</p>`:''}<p class="rf"><b>Plan progress</b>${r.plan.filter(p=>p.done).length} of ${r.plan.length} plan activities completed</p></div></section>
  <footer class="rsg"><div><b>${esc(r.sup.name)}</b>Supervisor · ${esc(r.dept)}</div><div><b>${HRS[0]}</b>HR · Professional & Organisational Development</div></footer>
  <p class="rc">Confidential · prepared for ${to==='uni'?'the trainee’s university':'BDO'} only · ALUMATE Trainee Management System</p></article></div>`;
}

/* ============ Render ============ */
function render(keep){
  applyLang();S._g=null;const y=window.scrollY;let h;
  if(S.view==='home')h=vHome();else if(S.view==='apply')h=vApply();else if(S.view==='signin')h=vSignin();else h=S.portal==='h'?vHR():S.portal==='t'?vTrainee():vSup();
  document.getElementById('app').innerHTML=h;
  document.getElementById('layer').innerHTML=(S.drawer?drawer():'')+modal()+(S.report?reportView():'');
  if(keep)window.scrollTo(0,y);
}
function go(v){S.notif=false;if(v==='signin'&&S.auth[S.lt]){S.portal=S.lt;S.view='portal'}else S.view=v;S.drawer=null;S.modal=null;S.side=false;render();window.scrollTo(0,0)}
function refocus(id){const n=document.getElementById(id);if(n&&n.focus){n.focus();try{const l=n.value.length;n.setSelectionRange(l,l)}catch(e){}}}
const now=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function touch(){if(S.ev){S.ev.saved=now();S.ev.err=''}}
function evSubmit(){const r=byId(S.ev.id),E=S.ev,c=evCalc(E),cc=c.cc;
  const ev={month:E.month,type:mlabel(r.end)===E.month?'Final evaluation':'Monthly review',sched:c.sched,attended:c.att,excused:c.exc,idx:cc.idx,attPct:cc.att,att:cc.ti,scores:E.scores.slice(),cmts:E.cmts.slice(),avg:c.avg,final:Math.round(c.avg/4*100),strengths:E.strengths,develop:E.develop,mentorFb:E.mentorFb,traineeCmt:'',completion:E.completion,rec:E.rec,by:r.sup.name,sign:{sup:true,mentor:!!E.mentorFb.trim(),trainee:false,hr:false}};
  if(E.edit!=null){r.evals[E.edit]=ev;lg(r,TODAY,r.sup.name,`${E.month} evaluation edited and sent again · ${c.avg.toFixed(2)} / 4 · allowance ${FIXED(r)?STIPEND[r.track]+" OMR":cc.p+"%"}`);S.ev=null;S.page.s='evaluations';toast(tt('{m} evaluation updated',{m:fm(E.month)}));return}
  r.evals=r.evals.concat([ev]).sort((a,b)=>new Date('1 '+a.month)-new Date('1 '+b.month));delete S.drafts[r.id+'|'+E.month];
  lg(r,TODAY,r.sup.name,`${E.month} evaluation signed and submitted · ${c.avg.toFixed(2)} / 4 · allowance ${FIXED(r)?STIPEND[r.track]+" OMR":cc.p+"%"}`);S.ev=null;S.page.s='trainee';toast(tt('{m} evaluation submitted',{m:fm(E.month)}))}

document.addEventListener('click',e=>{
  if(S.notif&&!e.target.closest('.ntf,[data-act=bell]')){S.notif=false;render(true)}
  const el=e.target.closest('[data-act]');if(!el||el.disabled)return;
  if(el.closest('.ntf'))S.notif=false;
  const a=el.dataset.act,v=el.dataset.v,id=el.dataset.id,A=S.apply,E=S.ev;
  switch(a){
    case 'go':go(v);break;
    case 'scroll':if(S.view!=='home'){S.view='home';render()}{const n=document.getElementById('sec-'+v);if(n&&n.scrollIntoView)n.scrollIntoView({behavior:'smooth',block:'start'})}break;
    case 'lang':S.lang=v;try{localStorage.setItem('kh-lang',v)}catch(err){}render(true);break;
    case 'lt':S.lt=v;render(true);break;
    case 'demo-t':S.lg.t.v=v;S.lg.t.err='';render(true);break;
    case 'demo-s':S.lg.s.v=v;S.lg.s.p=SUP_PASS;S.lg.s.err='';render(true);break;
    case 'demo-h':S.lg.h.v=HR_USER;S.lg.h.p=HR_PASS;S.lg.h.err='';render(true);break;
    case 't-back':S.lg.t={sent:false,id:null,code:'',err:'',v:S.lg.t.v};render(true);break;
    case 'h-back':S.lg.h.step=1;S.lg.h.err='';render(true);break;
    case 'ap-start':S.apply={step:1,track:v,f:{},done:null,err:''};go('apply');break;
    case 'ap-track':A.track=v;A.err='';render(true);break;
    case 'ap-set':A.f[el.dataset.k]=v;if(el.dataset.k==='grad')A.f.gradYear='';A.err='';render(true);break;
    case 'ap-goto':A.step=Number(v);A.err='';render();break;
    case 'ap-next':A.err=apValidate();if(!A.err){A.step++;render();window.scrollTo(0,0)}else render(true);break;
    case 'ap-back':A.step--;A.err='';render();break;
    case 'ap-sample':apSample();A.err='';render(true);break;
    case 'ap-submit':apSubmit();render();window.scrollTo(0,0);break;
    case 'ap-new':S.apply={step:0,track:null,f:{},done:null,err:''};render();break;
    case 'go-hr-app':S.page.h='applicants';S.f={track:'all',pri:'all',stage:'pipeline',q:''};if(S.auth.h){S.portal='h';S.view='portal';S.drawer=id}else{S.after=id;S.lt='h';S.view='signin'}render();window.scrollTo(0,0);break;
    case 'pg':S.page[S.portal]=v;S.drawer=null;S.side=false;S.ev=null;render();window.scrollTo(0,0);break;
    case 'side':S.side=!S.side;render(true);break;
    case 'bell':S.notif=!S.notif;render(true);break;
    case 'doc':S.modal={type:'doc',v};render(true);break;
    case 'logout':S.auth[S.portal]=S.portal==='h'?false:null;S.ev=null;S.drawer=null;S.side=false;S.view='home';S.portal=null;render();window.scrollTo(0,0);toast(t('Signed out'));break;
    case 'open':S.drawer=id;S.evOpen=null;render(true);break;
    case 'close':S.drawer=null;render(true);break;
    case 'close-m':S.modal=null;render(true);break;
    case 'ev-open':S.evOpen=S.evOpen===v?null:v;render(true);break;
    case 'open-ev':S.modal={type:'ev',id,i:Number(v)};render(true);break;
    case 'adv':{const r=byId(id),ns=nextStage(r);if(!ns)break;if(ns==='Assessment'&&r.iq==null){r.iq=ri(55,96);r.pers=ri(52,94)}if(ns==='Selected'){if(!r.dept)assign(r,true);r.accepted=TODAY}r.stage=ns;lg(r,TODAY,HRS[0],'Moved to '+ns);toast(tt('Moved to {s}',{s:t(ns)}));render(true);break}
    case 'rej':{const r=byId(id);r.stage='Not Selected';r.reason='Not selected by HR';lg(r,TODAY,HRS[0],'Marked not selected');toast(t('Marked not selected'));render(true);break}
    case 'med-sms':S.modal={type:'sms',id};render(true);break;
    case 'med-send':{const r=byId(id);r.medSms=true;lg(r,TODAY,HRS[0],`Medical SMS prepared · ${fmt(r.medDate)} ${r.medTime}`);S.modal=null;toast(t('SMS marked as sent'));render(true);break}
    case 'med-res':{const r=byId(id);if(v==='Fit'){r.stage='Pre-Training';r.start=D(2026,11,1);r.end=D(2026,12,31);setSup(r);setPre(r,0);LOAD[r.dept]++;lg(r,TODAY,'Medical Centre','Fit · moved to Pre-Training');toast(t('Fit · moved to Pre-Training'))}else{r.stage='Not Selected';r.reason='Medical';lg(r,TODAY,'Medical Centre','Unfit');toast(t('Recorded as unfit'))}render(true);break}
    case 'tog':{const r=byId(id),o=el.dataset.sec==='post'?r.post:r.pre,k=el.dataset.k;o[k]=o[k]==='done'?'pending':'done';if(el.dataset.sec==='post'&&['ppe','card','laptop'].every(x=>r.post[x]!=='pending'))r.post.cert='done';lg(r,TODAY,HRS[0],(PRE.concat(POST).find(p=>p[0]===k)||[k,k])[1]+' · '+o[k]);render(true);break}
    case 'stg':S.f.stage=S.f.stage===v&&v!=='all'?'pipeline':v;render(true);break;
    case 'tmode':S.tf.mode=v;render(true);break;
    case 'etab':S.eTab=v;render(true);break;
    case 'copy-link':{const n=document.getElementById('eid-link');const ok=()=>toast(t('Link copied'));try{navigator.clipboard.writeText(n.value).then(ok,()=>{n.select();toast(t('Select the link and copy it'))})}catch(err){n.select()}break}
    case 'rep':S.report={id,to:v};render(true);break;
    case 'rep-to':S.report.to=v;render(true);break;
    case 'rep-close':S.report=null;render(true);break;
    case 'rep-pdf':try{window.print()}catch(err){}break;
    case 'am-ok':S.approved[S.am]=fmt(TODAY);toast(t('Approved for payroll'));render(true);break;
    case 'remind':toast(tt('Reminder prepared for {s}',{s:v}));break;
    case 'ev-hr':{const r=byId(id),x=r.evals[Number(v)];x.sign.hr=true;lg(r,TODAY,HRS[0],x.month+' evaluation signed by HR');S.modal=null;toast(t('Signed by HR'));render(true);break}
    case 'ev-ack':{const r=byId(S.auth.t),x=r.evals[Number(v)];x.traineeCmt=S.tc;x.sign.trainee=true;S.tc='';lg(r,TODAY,'Trainee',x.month+' evaluation signed by trainee');toast(t('Evaluation signed'));render(true);break}
    case 'hyear':S.hf.year=S.hf.year==v?'all':v;render(true);break;
    case 'set-save':{const e1=Number(val('set-e')),o1=Number(val('set-o')),th=Number(val('set-th'));if(!(e1>0&&o1>0&&th>ALLOW[1].min&&th<=100)){toast(t('Check the values: index between 71 and 100'));break}
      STIPEND.Eidaad=e1;STIPEND.Summer=STIPEND.Winter=STIPEND.Referral=o1;ALLOW[0].min=th;ALLOW.forEach((x,i)=>TIERS[i].p=x.p);
      ALL.forEach(r=>r.evals.forEach(x=>{const c=allowCalc(x.sched,x.attended,x.excused,x.avg);x.idx=c.idx;x.att=c.ti}));toast(t('Settings saved'));render(true);break}
    case 'sup-open':S.supSel=id;S.page.s='trainee';render();window.scrollTo(0,0);break;
    case 'ev-edit':{const r=byId(id),i=Number(v);if(!r.evals[i]||r.evals[i].sign.hr)break;S.supSel=id;S.ev=evEdit(r,i);S.page.s='form';render();window.scrollTo(0,0);break}
    case 'ev-start':S.supSel=id;S.ev=evNew(byId(id));S.page.s='form';render();window.scrollTo(0,0);break;
    case 'ev-exit':S.page.s=S.supSel?'trainee':'trainees';S.ev=null;render();window.scrollTo(0,0);break;
    case 'ev-goto':E.step=Number(v);E.err='';render();window.scrollTo(0,0);break;
    case 'ev-prev':E.step--;E.err='';render();window.scrollTo(0,0);break;
    case 'ev-next':{const err=evStepErr(E,byId(S.supSel),E.step);E.err=err;if(!err){E.step++;touch();render();window.scrollTo(0,0)}else render(true);break}
    case 'ev-save':touch();toast(t('Draft saved'));render(true);break;
    case 'ev-sc':E.scores[Number(el.dataset.i)]=Number(v);touch();render(true);break;
    case 'ev-cmt':E.open[v]=true;render(true);refocus('evc-'+v);break;
    case 'ev-comp':E.completion=v;touch();render(true);break;
    case 'ev-rec':E.rec=v;touch();render(true);break;
    case 'ev-submit':{const err=evStepErr(E,byId(S.supSel),4)||evStepErr(E,byId(S.supSel),1)||evStepErr(E,byId(S.supSel),2);if(err){E.err=err;render(true);break}evSubmit();render();window.scrollTo(0,0);break}
    case 'plan-add':{const n=val('plan-new').trim();if(n){byId(S.supSel).plan.push({t:n,done:false});render(true)}break}
  }
});
document.addEventListener('input',e=>{const el=e.target,id=el.id;
  if(el.dataset.ap){S.apply.f[el.dataset.ap]=el.value;return}
  if(S.ev&&el.dataset.evc!=null){S.ev.cmts[Number(el.dataset.evc)]=el.value;S.ev.saved=now();return}
  if(S.ev&&{'ev-str':'strengths','ev-dev':'develop','ev-men':'mentorFb'}[id]){S.ev[{'ev-str':'strengths','ev-dev':'develop','ev-men':'mentorFb'}[id]]=el.value;S.ev.saved=now();return}
  if(id==='tc-text'){S.tc=el.value;return}
  if(S.ev&&(id==='ev-sched'||id==='ev-attd'||id==='ev-exc')){S.ev[{'ev-sched':'sched','ev-attd':'attended','ev-exc':'excused'}[id]]=el.value;touch();render(true);refocus(id);return}
  if(id==='top-q'){S.f.q=el.value;if(S.page.h!=='applicants'){S.page.h='applicants';S.f.stage='all'}render(true);refocus(id);return}
  if(id==='f-q'){S.f.q=el.value;render(true);refocus(id);return}
  if(id==='h-q'){S.hf.q=el.value;render(true);refocus(id);return}
});
document.addEventListener('change',e=>{const el=e.target,id=el.id;
  if(el.dataset.ap){S.apply.f[el.dataset.ap]=el.value;return}
  if(el.dataset.file){S.apply.f['file_'+el.dataset.file]=el.files&&el.files[0]?el.files[0].name:'';render(true);return}
  const map={'f-track':v=>S.f.track=v,'f-pri':v=>S.f.pri=v,'f-stage':v=>S.f.stage=v,'h-year':v=>S.hf.year=v,'h-dept':v=>S.hf.dept=v,'am-m':v=>S.am=v,'am-t':v=>S.amTrack=v};
  if(map[id]){map[id](el.value);render(true);return}
  if(id==='t-inc'){S.tf.inc=el.checked;render(true);return}
  if(id==='ev-conf'){S.ev.confirm=el.checked;S.ev.err='';render(true);return}
  if(el.dataset.plan!=null){byId(S.supSel).plan[Number(el.dataset.plan)].done=el.checked;render(true);return}
  if(el.dataset.med){const r=byId(el.dataset.id);if(el.dataset.med==='date')r.medDate=el.value?new Date(el.value+'T00:00'):null;else r.medTime=el.value;render(true)}
});
document.addEventListener('toggle',e=>{const d=e.target;if(d&&d.dataset&&d.dataset.gd)S.gd[d.dataset.gd]=d.open},true);
document.addEventListener('submit',e=>{e.preventDefault();const f={'f-t1':lgT1,'f-t2':lgT2,'f-s':lgS,'f-h1':lgH1,'f-h2':lgH2}[e.target.id];if(f){f();render(true);refocus(S.lt==='t'?'g-code':'g-hc')}});
document.addEventListener('keydown',e=>{if(e.key!=='Escape')return;if(S.notif)S.notif=false;else if(S.report)S.report=null;else if(S.modal)S.modal=null;else if(S.drawer)S.drawer=null;else if(S.side)S.side=false;else return;render(true)});
/* start in the language from ?lang=, the last choice (shared with the other pages) or the browser */
S.lang=(()=>{const q=new URLSearchParams(location.search).get('lang');if(q==='ar'||q==='en')return q;
  try{const s=localStorage.getItem('kh-lang');if(s==='ar'||s==='en')return s}catch(err){}
  return String(navigator.language||'en').toLowerCase().indexOf('ar')===0?'ar':'en'})();
render();

</script>
