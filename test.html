    'Your test day is {d}. Come back to this page on that day with the same mobile number and access code.':'يوم اختبارك هو {d}. عُد إلى هذه الصفحة في ذلك اليوم بنفس رقم الجوال ورمز الدخول.',
    'Change day':'تغيير اليوم',
    'Choose the day you will take the tests. Your test period is {a} to {b}. You can take the tests only on the day you choose.':'اختر اليوم الذي ستؤدي فيه الاختبارين. فترة الاختبار من {a} إلى {b}. يمكنك أداء الاختبارين في اليوم الذي تختاره فقط.',
    'Today':'اليوم','Confirm day':'تأكيد اليوم','Choose a day first.':'اختر يوماً أولاً.','Your test day':'يوم اختبارك','Saving':'جارٍ الحفظ','Days to choose from':'الأيام المتاحة'
  });
  var shuffle=function(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var x=a[i];a[i]=a[j];a[j]=x}return a};
  var SEASONS={w26:'Winter 2026',s27:'Summer 2027'};
  var DISC=KH.DISC,D={};DISC.forEach(function(d){D[d.id]=d});
  var TN=['Access code','IQ test','Personality'];
  var L5=['Strongly disagree','Disagree','Neutral','Agree','Strongly agree'];
  var activeTimer=null,ID={phone:'',code:''},BANK=null,QZ=null;
  var S={view:'code',step:0,intro:null,msg:'',pickDay:0,chg:false};

  function renderSteps(step){
    S.step=step;var h='';
    for(var i=0;i<TN.length;i++){
      var cls=step>i?'done':(step===i?'cur':'');
      h+='<div class="st '+cls+'"><b>'+(step>i?'✓':(i+1))+'</b><span>'+esc(t(TN[i]))+'</span></div>';
      if(i<TN.length-1)h+='<div class="ln '+(step>i?'done':'')+'"></div>';
    }
    $('#steps').innerHTML=h;
  }
  function panel(inner){$('#stage').innerHTML='<div class="panel narrow" id="panel">'+inner+'</div>'}

  function showCode(msg){
    S.view='code';QZ=null;
    var pv=$('#c-phone')?$('#c-phone').value:'',cv=$('#c-code')?$('#c-code').value:'';
    renderSteps(0);
    $('#stage').innerHTML='<div class="split" id="panel"><div class="l">'+KH.art()+'<div class="brand"><span class="mk" aria-hidden="true"></span><span class="bn"><b>ALUMATE</b><small>'+esc(t('From student to professional'))+'</small></span></div><h2>'+esc(t('Start your assessment'))+'</h2><p>'+esc(t('Two short tests, taken once.'))+'</p></div>'+
      '<div class="r"><h2>'+esc(t('Enter your access code'))+'</h2><p class="muted" style="margin-top:.3rem">'+esc(t('Enter the mobile number you registered with and the access code from your SMS.'))+'</p>'+
      '<form id="cf" novalidate><div class="f" style="margin-top:.4rem"><label for="c-phone">'+esc(t('Mobile number'))+'</label><input id="c-phone" dir="ltr" inputmode="numeric" autocomplete="tel" placeholder="9XXXXXXX"></div>'+
      '<div class="f" style="margin-top:1rem"><label for="c-code">'+esc(t('Access code'))+'</label><input id="c-code" dir="ltr" class="codein" maxlength="6" placeholder="K7M2QX" autocomplete="off"></div>'+
      '<div class="err big" id="e-code">'+esc(msg?t(msg):'')+'</div>'+
      '<div class="actions" style="margin-top:.6rem"><button class="btn" type="submit" id="c-go">'+esc(t('Continue'))+'</button></div></form></div></div>';
    $('#c-phone').value=pv;$('#c-code').value=cv;
    $('#cf').addEventListener('submit',function(e){
      e.preventDefault();
      var phone=$('#c-phone').value.replace(/\s/g,''),code=$('#c-code').value.trim();
      var er=$('#e-code'),go=$('#c-go');
      if(!/^\d{8}$/.test(phone)||code.length<4){er.textContent=t('Enter your 8-digit number and the code from your SMS.');return}
      go.disabled=true;go.textContent=t('Checking');er.textContent='';
      google.script.run.withSuccessHandler(function(r){
        if(!r||r.error){go.disabled=false;go.textContent=t('Continue');er.textContent=t((r&&r.error)||'Something went wrong.');return}
        ID.phone=phone;ID.code=code;showIntro(r);
      }).withFailureHandler(function(){go.disabled=false;go.textContent=t('Continue');er.textContent=t('We could not reach the server. Please try again.')}).tVerify(phone,code);
    });
  }
  /* The test can only be taken on a day the applicant picked inside the test period HR set */
  function showDays(r,change){
    S.view='days';S.intro=r;S.chg=!!change;renderSteps(0);
    var w=r.win,days=[],d,first=String(r.name).split(' ')[0];
    for(d=Math.max(w.from,w.today);d<=w.to;d++)days.push(d);
    if(w.day>w.today&&!change){
      panel('<div class="done"><div class="tick">✓</div><h2 class="h2">'+esc(t('Your test is booked'))+'</h2><p>'+esc(t('Your test day is {d}. Come back to this page on that day with the same mobile number and access code.',{d:KH.dayFmt(w.day,null,'long')}))+'</p><div class="actions" style="justify-content:center"><button class="btn ghost" id="chgday" type="button">'+esc(t('Change day'))+'</button></div></div>');
      $('#chgday').addEventListener('click',function(){S.pickDay=w.day;showDays(r,true)});
      return;
    }
    if(!change&&!S.pickDay)S.pickDay=0;
    panel('<h2 class="h2">'+esc(t('Hello, {n}',{n:first}))+'</h2><p class="muted" style="margin-top:.3rem">'+esc(t('Choose the day you will take the tests. Your test period is {a} to {b}. You can take the tests only on the day you choose.',{a:KH.dayFmt(w.from,null,'short'),b:KH.dayFmt(w.to,null,'short')}))+'</p>'+
      '<div class="days" role="group" aria-label="'+esc(t('Days to choose from'))+'">'+days.map(function(x){return '<button type="button" class="day" data-day="'+x+'" aria-pressed="'+(S.pickDay===x)+'">'+esc(KH.dayFmt(x))+(x===w.today?'<small>'+esc(t('Today'))+'</small>':'')+'</button>'}).join('')+'</div>'+
      '<div class="err big" id="e-day"></div><div class="actions" style="margin-top:.8rem"><button class="btn" id="dayok" type="button">'+esc(t('Confirm day'))+'</button></div>');
    $$('.day').forEach(function(b){b.addEventListener('click',function(){S.pickDay=+b.dataset.day;$$('.day').forEach(function(x){x.setAttribute('aria-pressed',String(+x.dataset.day===S.pickDay))});$('#e-day').textContent=''})});
    $('#dayok').addEventListener('click',function(){
      var er=$('#e-day'),go=$('#dayok');
      if(!S.pickDay){er.textContent=t('Choose a day first.');return}
      go.disabled=true;go.textContent=t('Saving');er.textContent='';
      google.script.run.withSuccessHandler(function(u){
        if(!u||u.error){go.disabled=false;go.textContent=t('Confirm day');er.textContent=t((u&&u.error)||'Something went wrong.');return}
        r.win.day=u.day;r.win.today=u.today;
        if(u.day===u.today)showIntro(r);else showDays(r,false);
      }).withFailureHandler(function(){go.disabled=false;go.textContent=t('Confirm day');er.textContent=t('We could not reach the server. Please try again.')}).tPick(ID.phone,ID.code,S.pickDay);
    });
  }
  function showIntro(r){
    if(r.win&&r.win.day!==r.win.today){showDays(r,false);return}
    S.view='intro';S.intro=r;
    var d=D[r.disc],first=String(r.name).split(' ')[0];
    renderSteps(0);
    panel('<h2 class="h2">'+esc(t('Hello, {n}',{n:first}))+'</h2><p class="muted" style="margin-top:.3rem">'+esc(t('You are applying for {d} ({s}). Two short tests, taken once.',{d:d?KH.dt(d,'title'):t('the internship'),s:t(SEASONS[r.season]||'')}))+'</p>'+(r.win?'<p class="reqline"><b>'+esc(t('Your test day'))+':</b> '+esc(KH.dayFmt(r.win.day,null,'long'))+'</p>':'')+
      '<ul class="intro"><li><b>1</b><span>'+esc(t('IQ test: {n} reasoning questions, {s} seconds each. When time runs out the next question appears.',{n:r.nAb||8,s:r.seconds||40}))+'</span></li><li><b>2</b><span>'+esc(t('Personality: {n} statements, no time limit. Answer honestly, there are no right or wrong answers.',{n:r.nPe||20}))+'</span></li><li><b>!</b><span>'+esc(t('You can take the tests only once and cannot go back to a previous question. Find a quiet place and about 10 minutes.'))+'</span></li></ul>'+
      '<div class="err big" id="e-start"></div><div class="actions"><button class="btn" id="go1">'+esc(t('Start the IQ test'))+'</button></div>');
    $('#go1').addEventListener('click',function(){
      var b=$('#go1');b.disabled=true;b.textContent=t('Starting');
      google.script.run.withSuccessHandler(function(s){
        if(!s||s.error){b.disabled=false;b.textContent=t('Start the IQ test');$('#e-start').textContent=t((s&&s.error)||'Something went wrong.');return}
        BANK=s;runAbility();
      }).withFailureHandler(function(){b.disabled=false;b.textContent=t('Start the IQ test');$('#e-start').textContent=t('We could not reach the server. Please try again.')}).tStart(ID.phone,ID.code);
    });
  }
  var ABA=[];
  function runAbility(){
    S.view='quiz';renderSteps(1);
    runQuiz({title:'IQ test',noun:'Question',items:BANK.ability,seconds:BANK.seconds,onDone:function(ans){
      ABA=ans.map(function(k,i){return k>=0?BANK.ability[i].o[k].id:''});
      runPers();
    }});
  }
  function runPers(){
    S.view='quiz';renderSteps(2);
    var items=BANK.personality.map(function(p){return {q:p.q,o:L5.map(function(x,i){return {id:String(i),t:'label',v:x}})}});
    runQuiz({title:'Personality',noun:'Statement',items:items,seconds:0,onDone:function(ans){
      var send=function(n){
        google.script.run.withSuccessHandler(function(r){
          if(r&&r.error&&!/already submitted/.test(r.error)){S.view='error';S.msg=r.error;showError();return}
          finish();
        }).withFailureHandler(function(){
          if(n<3)setTimeout(function(){send(n+1)},1500);
          else{S.view='fail';showFail(function(){showSending();send(0)})}
        }).tSubmit(ID.phone,ID.code,ABA,ans);
      };
      showSending();send(0);
    }});
  }
  var retryFn=null;
  function showSending(){S.view='sending';QZ=null;panel('<div class="done"><h2 class="h2">'+esc(t('Sending your answers'))+'</h2><p>'+esc(t('Please wait a moment.'))+'</p></div>')}
  function showError(){QZ=null;panel('<div class="done"><h2 class="h2">'+esc(t('Something went wrong'))+'</h2><p>'+esc(t(S.msg))+'</p></div>')}
  function showFail(fn){
    if(fn)retryFn=fn;
    QZ=null;panel('<div class="done"><h2 class="h2">'+esc(t('We could not send your answers'))+'</h2><p>'+esc(t('Please keep this page open and check your connection.'))+'</p><div class="actions"><button class="btn" id="retry">'+esc(t('Try again'))+'</button></div></div>');
    $('#retry').addEventListener('click',function(){retryFn&&retryFn()});
  }
  function finish(){
    S.view='done';QZ=null;renderSteps(3);
    panel('<div class="done"><div class="tick">✓</div><h2 class="h2">'+esc(t('Thank you'))+'</h2><p>'+esc(t('Your answers were submitted. The team will contact you with the outcome.'))+'</p></div>');
  }

  function arrow(a){return '<svg viewBox="0 0 48 48" aria-hidden="true"><g transform="rotate('+a+' 24 24)" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M24 40V10M14 20L24 10l10 10"/></g></svg>'}
  function dots(n){var c='';for(var i=0;i<n;i++){c+='<circle cx="'+(9+(i%4)*10)+'" cy="'+(11+Math.floor(i/4)*13)+'" r="3.6" fill="currentColor"/>'}return '<svg viewBox="0 0 48 40" aria-hidden="true">'+c+'</svg>'}
  function optHtml(x){return x.t==='arrow'?arrow(x.v):(x.t==='dots'?dots(x.v):(x.t==='label'?esc(t(x.v)):esc(KH.pick(x.v))))}

  /* a quiz keeps its own clock, so switching language redraws the question without restarting the timer */
  function runQuiz(o){
    var items=o.items,i=0,ans=[],ready=false,t0=0;
    function leftNow(){return o.seconds-(performance.now()-t0)/1000}
    function draw(){
      var it=items[i],noun=t(o.noun+' {i} of {n}',{i:i+1,n:items.length});
      var head=o.seconds
        ?'<div class="qmeta"><span>'+esc(t(o.title))+' · '+esc(noun)+'</span><span id="tm" class="num">'+esc(t('{n}s',{n:Math.max(0,Math.ceil(leftNow()))}))+'</span></div><div class="tbar"><i id="tbar" style="width:'+Math.max(0,leftNow()/o.seconds*100)+'%"></i></div>'
        :'<div class="qmeta"><span>'+esc(t(o.title))+' · '+esc(noun)+'</span><span class="num">'+Math.round(i/items.length*100)+'%</span></div><div class="tbar"><i style="width:'+(i/items.length*100)+'%"></i></div>';
      var stem='';
      if(it.seq)stem='<div class="seq">'+esc(it.seq)+'</div>';
      if(it.vs)stem='<div class="vseries">'+it.vs.map(function(s){return '<span class="cell">'+optHtml(s)+'</span>'}).join('')+'<span class="cell q">?</span></div>';
      panel(head+'<h2 class="q">'+esc(KH.pick(it.q))+'</h2>'+stem+'<div class="opts'+(it.vis?' vis':'')+'">'+it.o.map(function(x,k){return '<button class="opt" id="o'+k+'" type="button" aria-label="'+esc(t('Option {k}',{k:k+1}))+'">'+optHtml(x)+'</button>'}).join('')+'</div>');
      $$('.opt').forEach(function(b,k){b.addEventListener('click',function(){if(ready)pick(k)})});
    }
    function start(){
      clearInterval(activeTimer);
      ready=false;setTimeout(function(){ready=true},350);
      t0=performance.now();draw();
      if(o.seconds){
        activeTimer=setInterval(function(){
          var left=leftNow();
          if(left<=0){pick(-1);return}
          var tm=$('#tm'),bar=$('#tbar'),pn=$('#panel');
          if(tm)tm.textContent=t('{n}s',{n:Math.ceil(left)});
          if(bar)bar.style.width=(left/o.seconds*100)+'%';
          if(left<8&&pn)pn.classList.add('late');
        },100);
      }
    }
    function pick(k){clearInterval(activeTimer);ans.push(k);i++;if(i>=items.length)o.onDone(ans,items);else start()}
    QZ={redraw:draw};
    start();
  }
  function repaint(){
    if(S.view==='code')showCode();
    else if(S.view==='intro')showIntro(S.intro);
    else if(S.view==='days')showDays(S.intro,S.chg);
    else if(S.view==='quiz'&&QZ){renderSteps(S.step);QZ.redraw()}
    else if(S.view==='sending')showSending();
    else if(S.view==='error')showError();
    else if(S.view==='fail')showFail();
    else if(S.view==='done')finish();
  }
  KH.init(FORCE_LANG);KH.mount('#langslot');
  KH.on(repaint);
  showCode();
})();
</script>
</body></html>
