  /* ----- stage 4: selection ----- */
  function calc(a){
    var s={gpa:a.gpa/4*100,ab:a.ab,pe:a.pe},tot=W.gpa+W.ab+W.pe,c={},p={},sum=0;
    SEG.forEach(function(k){p[k]=tot>0?W[k]/tot*100:0;c[k]=s[k]*p[k]/100;sum+=c[k]});
    return {a:a,sum:sum,c:c,p:p,raw:s};
  }
  function key(){return H.disc+'|'+H.season}
  function build(){
    var all=apps.filter(function(a){return a.season===H.season&&a.disc===H.disc&&a.status==='assessed'}).map(calc);
    var elig=[],below=[],dec=[];
    all.forEach(function(x){
      if(x.a.dec==='decline')dec.push(x);
      else if(x.a.dec==='accept'||(x.a.gpa>=G.minGpa&&x.a.ab>=G.minAb))elig.push(x);
      else below.push(x);
    });
    var cmp=function(x,y){return y.sum-x.sum||y.a.ab-x.a.ab};
    elig.sort(function(x,y){return (y.a.dec==='accept'?1:0)-(x.a.dec==='accept'?1:0)||cmp(x,y)});
    below.sort(cmp);dec.sort(cmp);
    var want=H.open[key()];if(want==null)want=D[H.disc].base;
    var n=elig.length?clamp(want,1,elig.length):0;
    return {all:all,elig:elig,below:below,dec:dec,n:n};
  }
  function radar(sc){
    var cx=130,cy=95,R=62,LR=74,n=5;
    var pt=function(i,v){var a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100]};
    var poly=function(v){return ORDER.map(function(k,i){return pt(i,v).map(function(z){return z.toFixed(1)}).join(',')}).join(' ')};
    var h='<svg class="radar" viewBox="-28 0 316 190" role="img" aria-label="'+esc(t('Personality profile'))+'">';
    [25,50,75,100].forEach(function(v){h+='<polygon class="ring" points="'+poly(v)+'"/>'});
    ORDER.forEach(function(k,i){var p=pt(i,100);h+='<line class="axis" x1="'+cx+'" y1="'+cy+'" x2="'+p[0].toFixed(1)+'" y2="'+p[1].toFixed(1)+'"/>'});
    h+='<polygon class="area" points="'+ORDER.map(function(k,i){return pt(i,sc[k]).map(function(z){return z.toFixed(1)}).join(',')}).join(' ')+'"/>';
    ORDER.forEach(function(k,i){
      var p=pt(i,sc[k]);h+='<circle class="pt" cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="3"/>';
      var a=-Math.PI/2+i*2*Math.PI/n,lx=cx+Math.cos(a)*LR,ly=cy+Math.sin(a)*LR+3,c=Math.cos(a);
      h+='<text x="'+lx.toFixed(1)+'" y="'+ly.toFixed(1)+'" text-anchor="'+(c>.3?'start':(c<-.3?'end':'middle'))+'">'+esc(tl(k))+' '+sc[k]+'</text>';
    });
    return h+'</svg>';
  }
  function hist(v){
    var W0=360,H0=150,l=24,r=8,tp=14,b=22,pw=W0-l-r,ph=H0-tp-b,bins=7,lo=30;
    var tot=[],acc=[],i;for(i=0;i<bins;i++){tot.push(0);acc.push(0)}
    v.elig.forEach(function(x,idx){var k=clamp(Math.floor((x.sum-lo)/10),0,bins-1);tot[k]++;if(idx<v.n)acc[k]++});
    var mx=Math.max(3,Math.max.apply(null,tot)),bw=pw/bins,s='<svg class="chart" viewBox="0 0 '+W0+' '+H0+'" role="img" aria-label="'+esc(t('Distribution of final scores'))+'">';
    s+='<line class="ax" x1="'+l+'" y1="'+(tp+ph)+'" x2="'+(W0-r)+'" y2="'+(tp+ph)+'"/>';
    s+='<text x="'+(l-5)+'" y="'+(tp+ph+3)+'" text-anchor="end">0</text><text x="'+(l-5)+'" y="'+(tp+8)+'" text-anchor="end">'+mx+'</text>';
    for(i=0;i<bins;i++){
      var x=l+i*bw+3,w=bw-6,ha=acc[i]/mx*ph,ho=(tot[i]-acc[i])/mx*ph;
      if(ho>0)s+='<rect x="'+x.toFixed(1)+'" y="'+(tp+ph-ha-ho).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+ho.toFixed(1)+'" rx="2" fill="var(--line-2)"/>';
      if(ha>0)s+='<rect x="'+x.toFixed(1)+'" y="'+(tp+ph-ha).toFixed(1)+'" width="'+w.toFixed(1)+'" height="'+ha.toFixed(1)+'" rx="2" fill="var(--seat)"/>';
      s+='<text x="'+(l+i*bw).toFixed(1)+'" y="'+(H0-6)+'" text-anchor="middle">'+(lo+i*10)+'</text>';
    }
    s+='<text x="'+(W0-r)+'" y="'+(H0-6)+'" text-anchor="middle">100</text>';
    if(v.n>0){
      var cut=v.elig[v.n-1].sum,cx=l+clamp((cut-lo)/70,0,1)*pw;
      s+='<line class="cut" x1="'+cx.toFixed(1)+'" y1="'+(tp-4)+'" x2="'+cx.toFixed(1)+'" y2="'+(tp+ph)+'" stroke-width="2"/>';
      s+='<text class="cuttx" x="'+cx.toFixed(1)+'" y="'+(tp-6)+'" text-anchor="'+(cx>W0-60?'end':'start')+'">'+esc(t('Cutoff {n}',{n:cut.toFixed(1)}))+'</text>';
    }
    return s+'</svg>';
  }

  var SEASON_AR={w26:'شتوي 2026',s27:'صيفي 2027'};

    var n=a.name.split(' ')[0],dd=D[a.disc];

  function s4dyn(){

  function parseLine(line){

      if(q){if(c==='"'){if(line[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
      else if(c==='"')q=true;
      else if(c===d){out.push(cur.trim());cur=''}
      else cur+=c;
    }
    out.push(cur.trim());return out;
  }

    apps.forEach(function(a){have[a.phone+'|'+a.season]=1});
    lines.forEach(function(l,i){
      var c=parseLine(l);
      if(i===0&&/^(full\s*)?name/i.test(c[0]))return;
      var name=c[0]||'',phone=(c[1]||'').replace(/\D/g,'').slice(-8),email=c[2]||'',uni=c[3]||'',major=c[4]||'',dtx=c[5]||'',gpa=parseFloat((c[6]||'').replace(',','.')),it=c[7]||'';
      var season=/summer|s27|2027/i.test(it)?'s27':(/winter|w26|2026/i.test(it)?'w26':H.season);
      if(name.split(/\s+/).length<2||phone.length!==8||isNaN(gpa)||gpa<0||gpa>4){res.bad++;return}
      var di=dtx?discOf(dtx):discOf(major);
      if(!di){res.skip++;stop[season]++;return}
      if(have[phone+'|'+season]){res.dup++;return}
      have[phone+'|'+season]=1;
      var a={id:'i'+Date.now().toString(36)+i+Math.random().toString(36).slice(2,5),lang:KH.hasArabic(name)?'ar':'en',name:name,phone:phone,email:email,uni:uni,major:major,gov:'',wil:'',disc:di,gpa:Math.round(gpa*100)/100,season:season,at:Date.now(),why:'',status:'new',dec:'auto',notified:{}};

  function bulkScores(text){
    var res={ok:0,miss:0,bad:0};
    text.split(/\r?\n/).filter(function(l){return l.trim()}).forEach(function(l){
      var c=parseLine(l),phone=(c[0]||'').replace(/\D/g,'').slice(-8);
      if(phone.length!==8)return;
      var nums=c.slice(1).map(function(x){return parseFloat(String(x).replace(',','.'))});
      if(!(nums.length===2||nums.length===6)||nums.some(function(n){return isNaN(n)||n<0||n>100})){res.bad++;return}
      var a=apps.filter(function(x){return x.phone===phone&&x.season===H.season&&x.status==='invited'})[0];
      if(!a){res.miss++;return}
      a.ab=Math.round(nums[0]);
      var tr={};
      if(nums.length===6){ORDER.forEach(function(k,i){tr[k]=Math.round(nums[i+1])});a.pe=Math.round(ORDER.reduce(function(s,k){return s+tr[k]},0)/5)}

  }

    if(d.W)W=d.W;
    if(d.G)G=d.G;
    if(typeof d.screenGpa==='number')H.screenGpa=d.screenGpa;
    if(d.smsText)H.sms.en=d.smsText;
    if(d.smsTextAr)H.sms.ar=d.smsTextAr;
    LINK=d.link||DEFAULT_LINK;
    if(d.open)H.open=d.open;
    if(d.programme){['w26','s27'].forEach(function(k){var q=d.programme[k]||{};PROG[k]={open:q.open!==false,start:q.start||'',weeks:q.weeks?String(q.weeks):'',deadline:q.deadline||''}})}
    if(d.blocked)blocked={w26:d.blocked.w26||0,s27:d.blocked.s27||0};
  }
  function loadAll(first){
    return call('load').then(function(r){
      if(r.base&&!window.ALUMATE_API){BASE=r.base;DEFAULT_LINK=BASE+'?p=test'}
      apps=r.apps;outbox=r.msgs;applySet(r.settings||{});
      if(first){setLive('on','Live · saved to your Google Sheet');$('#login').hidden=true;$('#v-adm').hidden=false;render()}
      else soft();
    });
  }
  $('#lf').addEventListener('submit',function(e){
    e.preventDefault();
    var go=$('#lgo'),er=$('#lerr');PW=$('#pw').value;
    if(!PW){er.textContent=t('Enter the password.');return}
    go.disabled=true;go.textContent=t('Checking');er.textContent='';
    loadAll(true).then(function(){
      SYNC.poll=setInterval(function(){if(!pending()&&!typing()&&!document.hidden)loadAll(false).catch(function(){})},25000);
    }).catch(function(e2){go.disabled=false;go.textContent=t('Open console');er.textContent=errText(e2)});
  });
  KH.init(FORCE_LANG);KH.mount('#langslot');
  KH.on(function(){
    setLive(LIVE.mode,LIVE.txt);
    if(!$('#lgo').disabled)$('#lgo').textContent=t('Open console');
    if(!$('#v-adm').hidden)render();
  });
  $('#pw').focus();
})();
</script>
</body></html>
